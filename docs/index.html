<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOD — поведенческий профиль Бога в Танахе</title>
<style>
:root{--bg:#12141a;--card:#1b1f2a;--line:#2a3040;--fg:#e8eaf0;--dim:#9aa3b5;--acc:#e0b050;--acc2:#7fb2e5;--bad:#e07a6a;--ok:#7fce9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
header{padding:28px 24px 14px;max-width:1180px;margin:0 auto}
h1{margin:0;font-size:26px;font-weight:600}
h1 span{color:var(--acc)}
.sub{color:var(--dim);margin-top:6px}
nav{display:flex;gap:8px;max-width:1180px;margin:18px auto 0;padding:0 24px;flex-wrap:wrap}
nav button{background:var(--card);border:1px solid var(--line);color:var(--dim);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{color:var(--fg);border-color:var(--acc);background:#232837}
main{max-width:1180px;margin:0 auto;padding:20px 24px 60px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .v{font-size:24px;font-weight:600;color:var(--acc)}
.card .l{color:var(--dim);font-size:13px}
.card .b{font-size:12px;color:var(--fg2,#c8cdd8)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 4px;background:var(--line)}
.bar i{display:block;height:100%}
.leg{font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
h2{font-size:18px;margin:26px 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);font-size:13.5px}
th{color:var(--dim);font-weight:600;cursor:pointer;background:#20242f}
tr:hover td{background:#20242f}
input,select{background:#20242f;border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.he{font-family:"Times New Roman",serif;font-size:19px;line-height:1.9;direction:rtl;text-align:right}
.he.small{font-size:16px;color:#cdd3e0}
.out-P punishment{color:var(--bad)}.out-blessing{color:var(--ok)}.out-silence{color:var(--dim)}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;border:1px solid var(--line);color:var(--dim);margin-right:4px}
.tag.punishment{color:var(--bad);border-color:#5a3a34}
.tag.blessing,.tag.rescue,.tag.answer_granted{color:var(--ok);border-color:#2f4f3c}
.tag.silence{color:var(--dim)}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px}
.detail h3{margin:0 0 6px;font-size:16px;color:var(--acc)}
.sect{margin-top:12px}
.sect .h{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.src{color:var(--acc2);font-size:13px;margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.ep{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.ep:hover{border-color:var(--acc)}
.ep .s{color:var(--acc2);font-size:13px}
.note{color:var(--dim);font-size:12.5px;margin-top:8px}
a{color:var(--acc2)}
</style>
</head>
<body>
<header>
  <h1>GOD <span>·</span> поведенческий профиль Бога в Танахе</h1>
  <div class="sub">2 050 эпизодов взаимодействия Человек↔Бог · 39 книг · консонантный иврит + огласовка + подстрочник.
  Данные: экстракция эпизодов по контракту v2 (триггер → реакция → исход), аудит покрытия 100%.</div>
</header>
<nav>
  <button class="on" data-t="overview">Обзор</button>
  <button data-t="books">Книги</button>
  <button data-t="episodes">Эпизоды</button>
  <button data-t="profile">Профиль реакции</button>
  <button data-t="chat">Чат</button>
  <button data-t="about">О проекте</button>
</nav>
<main id="main"></main>

<script>
const C={punishment:'#e07a6a',revelation:'#e0b050',blessing:'#7fce9a',covenant:'#7fb2e5',rescue:'#8fd4c8',
answer_granted:'#a8d08d',compliance:'#c9b1e0',silence:'#6b7280',unclear:'#565e6e',delayed:'#b58e5f',refusal:'#c25a8e'};
let A=null; // analytics
const cache={};
async function jget(u){ if(!cache[u]) cache[u]=await (await fetch(u)).json(); return cache[u]; }
const B=b=>'/GOD/data/books/'+b+'.json';
function esc(s){return (s||'').replace(/&/g,'&').replace(/</g,'<')}
function bar(obj,limit){
  const tot=Object.values(obj).reduce((a,b)=>a+b,0)||1;
  const items=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,limit||99);
  return `<div class="bar">${items.map(([k,v])=>`<i style="width:${(v/tot*100).toFixed(1)}%;background:${C[k]||'#888'}"></i>`).join('')}</div>
  <div class="leg">${items.map(([k,v])=>`<span><i style="background:${C[k]||'#888'}"></i>${k} ${(v/tot*100).toFixed(0)}%</span>`).join('')}</div>`;
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');render(b.dataset.t)});

async function render(t){
  const m=document.getElementById('main');
  if(!A) A=await jget('/GOD/data/analytics.json');
  if(t==='overview') return overview(m);
  if(t==='books') return books(m);
  if(t==='episodes') return episodes(m);
  if(t==='profile') return profile(m);
  if(t==='chat') return chat_t(m);
  if(t==='about') return about(m);
}

function overview(m){
  const c=A.corpus, e=A.per_era;
  m.innerHTML=`
  <div class="cards">
    <div class="card"><div class="v">${c.episodes}</div><div class="l">эпизодов взаимодействия</div></div>
    <div class="card"><div class="v">${c.books}</div><div class="l">книг Танаха</div></div>
    <div class="card"><div class="v">24%</div><div class="l">эпизодов-наказаний</div><div class="b">из них 79% — объявленные оракулы</div></div>
    <div class="card"><div class="v">2.89</div><div class="l">средняя тяжесть (1–5)</div></div>
    <div class="card"><div class="v">55%</div><div class="l">инициатив у Бога</div><div class="b">человек инициирует 34%</div></div>
  </div>
  <h2>Портрет по эпохам</h2>
  <div class="cards">${Object.entries(e).map(([era,s])=>`
    <div class="card">
      <div class="l" style="color:var(--acc)">${era}</div>
      <div class="v">${s.episodes}</div>
      <div class="b">тяжесть ${s.severity_mean} · молчание ${(s.silence_rate*100).toFixed(0)}% · кара ${(s.punishment_rate*100).toFixed(0)}%</div>
      ${bar(s.outcome_p,5)}
    </div>`).join('')}</div>
  <h2>Весь корпус по исходам</h2>
  <div class="card">${bar(A.per_era['Тора'] ? mergeOutcomes() : {},12)}</div>
  <div class="note">Характерная асимметрия корпуса: наказание почти детерминировано проступком (57% кар — за непослушание),
  милость событийна и связана с заступничеством или покаянием (явная — 2,6% эпизодов).</div>`;
  function mergeOutcomes(){
    const o={};for(const s of Object.values(A.per_era))for(const[k,v]of Object.entries(s.outcome_p))o[k]=(o[k]||0)+v;
    return Object.fromEntries(Object.entries(o).map(([k,v])=>[k,Math.round(v*A.per_era['Тора'].episodes)||v]));
  }
}

function books(m){
  const rows=Object.entries(A.per_book).filter(([b,s])=>!s.missing).map(([b,s])=>({b,...s}));
  m.innerHTML=`<h2>Книги (${rows.length})</h2><div id="tb"></div>`;
  draw(rows);
  function draw(rows){
    document.getElementById('tb').innerHTML=`<table><tr><th data-k="b">Книга</th><th data-k="episodes">Эпизоды</th><th data-k="severity_mean">Тяжесть</th><th>Исходы</th><th data-k="silence_rate">Молчание</th><th data-k="punishment_rate">Кара</th><th>Эпоха</th></tr>
    ${rows.map(r=>`<tr><td><b>${r.b.replace('_',' ')}</b></td><td>${r.episodes}</td><td>${r.severity_mean}</td>
    <td style="min-width:220px">${bar(r.outcome_p,4)}</td>
    <td>${(r.silence_rate*100).toFixed(0)}%</td><td>${(r.punishment_rate*100).toFixed(0)}%</td><td>${r.era}</td></tr>`).join('')}</table>`;
  }
}

async function episodes(m){
  m.innerHTML=`<h2>Эпизоды</h2>
  <div class="filters">
    <select id="fb"><option value="">все книги</option>${Object.entries(A.book_order).flatMap(([era,bs])=>bs.map(b=>`<option value="${b}">${b.replace('_',' ')} · ${era}</option>`)).join('')}</select>
    <select id="fo"><option value="">все исходы</option>${Object.keys(C).map(k=>`<option>${k}</option>`).join('')}</select>
    <select id="fd"><option value="">инициатор: любой</option><option>god_initiated</option><option>human_initiated</option><option>divine_action</option></select>
    <input id="fq" placeholder="поиск по описанию (рус.)…">
  </div><div id="elist"><div class="note">Выберите книгу или фильтры — батчи книги подгружаются по требованию.</div></div>`;
  const load=async()=>{
    const b=document.getElementById('fb').value;
    const el=document.getElementById('elist');
    if(!b){el.innerHTML='<div class="note">Выберите книгу — загрузится её батч (лениво, по одной).</div>';return}
    el.innerHTML='<div class="note">загрузка…</div>';
    let eps=await jget(B(b));
    const fo=document.getElementById('fo').value, fd=document.getElementById('fd').value, q=document.getElementById('fq').value.toLowerCase();
    eps=eps.filter(e=>(!fo||e.outcome===fo)&&(!fd||e.direction===fd)&&(!q||(e.summary_ru+' '+e.god_action).toLowerCase().includes(q)));
    el.innerHTML=`<div class="note">${eps.length} эпизодов</div>`+eps.map((e,i)=>`
      <div class="ep" data-b="${b}" data-i="${i}"><span class="s">${b} ${e.span.start}–${e.span.end}</span>
      <span class="tag ${e.outcome}">${e.outcome}</span><span class="tag">${e.direction}</span><span class="tag">${e.trigger}</span><span class="tag">тяжесть ${e.severity}</span>
      <div>${esc(e.summary_ru)}</div></div>`).join('');
    el.querySelectorAll('.ep').forEach(d=>d.onclick=()=>show(d.dataset.b,+d.dataset.i));
  };
  ['fb','fo','fd'].forEach(id=>document.getElementById(id).onchange=load);
  document.getElementById('fq').oninput=()=>{clearTimeout(window._t);window._t=setTimeout(load,250)};
}

async function show(b,i){
  const eps=await jget(B(b)); const e=eps[i];
  const d=document.createElement('div'); d.className='detail';
  d.innerHTML=`<h3>${b} ${e.span.start}–${e.span.end}</h3>
    <div><span class="tag ${e.outcome}">${e.outcome}</span><span class="tag">${e.direction}</span><span class="tag">${e.via}</span>
    <span class="tag">${e.trigger}</span><span class="tag">тяжесть ${e.severity}</span><span class="tag">доверие ${e.confidence}</span></div>
    <div class="sect"><div class="h">Речь Бога (консонантный иврит)</div><div class="he">${esc(e.god_speech_plain)||'—'}</div></div>
    <div class="sect"><div class="h">Оласовка</div><div class="he small">${esc(Array.isArray(e._nik?e._nik:[]).join(' ')||'')}</div></div>
    <div class="sect"><div class="h">Действие Бога</div>${esc(e.god_action)}</div>
    ${e.human_speech_plain?`<div class="sect"><div class="h">Речь человека</div><div class="he small">${esc(e.human_speech_plain)}</div></div>`:''}
    <div class="sect"><div class="h">Резюме</div>${esc(e.summary_ru)}</div>
    <div class="sect"><div class="h">Эмоции</div>${(e.emotions||[]).map(x=>'<span class="tag">'+esc(x.emotion||x)+'</span>').join('')}</div>
    <div class="src">источники: ${e.book||b} ${e.span.start}–${e.span.end}</div>`;
  document.getElementById('elist').prepend(d);
  window.scrollTo({top:0,behavior:'smooth'});
}

function profile(m){
  const tt=A.trigger_table;
  m.innerHTML=`<h2>Профиль реакции: P(исход | триггер)</h2>
  <table><tr><th>Триггер (что человек сделал)</th><th>n</th><th>Распределение исходов</th></tr>
  ${Object.entries(tt).map(([t,s])=>`<tr><td><b>${t}</b></td><td>${s.n}</td><td style="min-width:340px">${bar(Object.fromEntries(Object.entries(s).filter(([k])=>k!=='n')),6)}</td></tr>`).join('')}</table>
  <h2>Кара: объявлена vs исполнена</h2>
  <div class="card"><div class="v">${A.punishment_split.total}</div><div class="l">эпизодов-наказаний</div>
  ${bar({announced_oracle:A.punishment_split.announced_oracle,executed_action:A.punishment_split.executed_action},2)}
  <div class="note">79% наказаний — пророческие оракулы-приговоры; исполненные действия без речи — 84 эпизода (4% корпуса). Это уточняет мартовскую оценку 15%: Бог как «грозящий» вчетверо чаще, чем как «бьющий».</div></div>`;
}

// ==================== ЧАТ (консервативный корпусный режим) ====================
// Без LLM на статичном сайте диалог невозможен в свободном режиме; здесь —
// retrieval по корпусу в браузере + ответ РЕАЛЬНОЙ речью эпизода-прецедента
// (никакой выдумки) + карточка ожидаемой реакции P(исход|триггер).
const TRIGS=[
 ["disobedience",["не буду","нарушу","нарушил","нарушила","нарушаю","не послушал","не послушаю","не исполнил","не буду слушать","отвергаю","идол","другого бога","не выполню","проигнорирую","откажусь","не стану","мне всё равно","плевать"]],
 ["intercession",["прости им","не губи","пощади","защити их","за них","сбереги их","не карай их","сжалься над ними"]],
 ["complaint",["согрешил","согрешила","прости меня","раскаиваюсь","провинился","виновен перед тобой","отступил от тебя"]],
 ["complaint",["почему ты","зачем ты","несправедливо","жалуюсь","ропщу","ты покинул","ты оставил","не заботишься"]],
 ["distress",["спаси","погибаю","беда","окружили","напали","враг одолел","умираю","утопаю","горит","страх","боюсь","боится"]],
 ["prayer",["молю","молюсь","прошу тебя","воззвал","обращаюсь к тебе с просьбой"]],
 ["inquiry",["скажи мне","что мне делать","спрашиваю","истолкуй","довольно ли","мне идти","кто виноват","объясни","почему так вышло","алейхем","what shall i do","tell me","why did you"]],
 ["vow",["даю обет","клянусь","обещаю тебе","обязуюсь"]],
 ["gratitude",["благодарю","славлю","хвала тебе","благодарю тебя","воспою тебе","thank you","i bless you"]],
 ["faithfulness",["делаю как велел","следую за тобой","верен тебе","исполнил всё","хожу путями твоими","люблю тебя всем сердцем"]],
 ["covenant_follow_up",["завет","обещание отцам","ради авраама","ради израиля","земля обещанная","потомству"]],
];
const CLASS_TRIGS=TRIGS.filter((_,i)=>i!==3); // confession-only группы не нужны для чата
function classifyRu(q){
  const m=q.toLowerCase();
  let trig=null;
  for(const [t,kws] of CLASS_TRIGS){ for(const k of kws){ if(m.includes(k)) return t;} }
  return "inquiry";
}
const RUS_SYN=[["умер","смерть","смерт","умирает","погиб","погибель"],["гнев","разгневал","гнева","гневен"],["милосерд","милост","простил","прощение","простить","пощадил"],["люб","любов","любовь","любим"],["страх","боюсь","боится","страшно","устраш"],["наказа","кара","наказание"],["спас","спасение","спасает","избав"],["молитв","молитва","молится","мол"],["завет"],["грех","греха","согрешил","преступ"]];
function syn(tok){const out=new Set([tok]);for(const g of RUS_SYN){if(g.some(x=>x===tok||(x.length>=4&&(tok.includes(x)||x.includes(tok)))))g.forEach(x=>out.add(x));}return[...out];}
async function chatGetAll(){
  if(chatGetAll._c) return chatGetAll._c;
  const out={};
  // грузим все 39 книг (лениво, по одной; ~4 МБ суммарно)
  for(const era of Object.values(A.book_order)) for(const b of era){
    if(b!=="genesis"&&!A.per_book[b]) continue;
    try{out[b]=await jget(B(b));}catch(e){}
  }
  chatGetAll._c=out; return out;
}
// сходство темы запроса с исходом (имитация отвечает по типу реакции)
const AFFIN=[
  ["punishment",["покарал","наказ","кара","гнев","азви","разруш","истреб","поразил","казнил"]],
  ["blessing",["благослови","милосерд","мольба о милости","прости","пощади","даровал"]],
  ["rescue",["спаси","спасения","избав","помоги","защити"]],
  ["answer_granted",["ответил","почему","зачем","даровал","довольно"]],
  ["silence",["молчал","не отвечаешь","почему молчишь"]],
];
function affinities(q){
  const m=q.toLowerCase(); const out=new Set();
  for(const[oc,kws]of AFFIN) for(const k of kws) if(m.includes(k)) out.add(oc);
  return out;
}
function chatRetrieve(q,docs){
  const aff=affinities(q);
  const qtok=new Set();for(const t of q.toLowerCase().match(/[а-яё-]{4,}/g)||[]) syn(t).forEach(x=>qtok.add(x));
  for(const t of q.toLowerCase().match(/[a-z]{2,}/g)||[]) qtok.add(t);
  const qs=q.split(/[^A-Za-zА-Яа-яёЁ]+/).filter(w=>/^[А-ЯA-Z]/.test(w)&&w.length>=4);
  let best=[];
  for(const [b,eps] of Object.entries(docs)){
    for(const e of eps){
      const txt=(e.summary_ru+" "+e.god_action).toLowerCase();
      let s=0;
      for(const t of qtok){
        if(txt.includes(t)){
          // длинные слова (имена/топонимы: Иерихон, Навуфея) бустим сильнее
          s+= t.length>=6 ? 10/Math.log(4+txt.length) : 1/Math.log(3+txt.length);
        }
      }
      for(const k of qs){ const w=k.toLowerCase(); if(w.length>=5&&k.startsWith(w.toUpperCase()[0])) s+=6/Math.log(4+txt.length); }
      if(e.god_speech_plain){ s+=1.5; }    // предпочитаем эпизоды с прямой речью
      if(aff.has(e.outcome)){ s+=2.5; }      // буст за соответствие ожидаемому исходу
      if(s>0) best.push([s,b,e]);
    }
  }
  best.sort((a,c)=>c[0]-a[0]);
  return best.slice(0,40);
}
function chatReply(q){
  return chatGetAll().then(docs=>{
    const hits=chatRetrieve(q,docs);
    const trig=classifyRu(q);
    const tt=A.trigger_table[trig]; const out={};
    if(tt) for(const[k,v]of Object.entries(tt)){if(k!=="n")out[k]=v;}
    return {hits,trig,probs:out};
  });
}
// ==================== ЧАТ (консервативный корпусный режим) ====================
// Без LLM на статичном сайте диалог невозможен в свободном режиме; здесь —
// retrieval по корпусу в браузере + ответ РЕАЛЬНОЙ речью эпизода-прецедента
// (никакой выдумки) + карточка ожидаемой реакции P(исход|триггер).
function chat_t(m){
  m.innerHTML=`<h2>Чат с имитацией</h2>
  <div class="note">Корпусный режим: вопрос на любом языке → поиск по 2 050 размеченным эпизодам →
  ответ <b>реальной речью</b> эпизода-прецедента (источник проверяем, без генерации).</div>
  <div class="filters" style="margin-top:12px"><input id="cq" style="flex:1" placeholder="что скажете Богу? (любой язык)…"></div>
  <div id="clog"></div>`;
  const log=document.getElementById('clog');
  const hist=[];
  const send=()=>{
    const q=document.getElementById('cq').value.trim(); if(!q) return;
    hist.push(["Вы",q]); draw();
    chatGetAll().then(docs=>{
      const hits=chatRetrieve(q,docs).slice(0,3);
      const trig=classifyRu(q);
      const tt=A.trigger_table[trig]; const probs={};
      if(tt) for(const[k,v]of Object.entries(tt)){if(k!=="n")probs[k]=v;}
      let h=`<div class="detail"><h3>Бог</h3>`;
      const top=hits.filter(x=>x[2].god_speech_plain)[0]||hits[0];
      if(top){
        const e=top[2];
        h+=`<div class="note">Прецедент — реальная речь корпуса, без выдумки.</div>`;
        h+=`<div class="sect"><div class="h">עברית (как в корпусе)</div><div class="he">${esc(e.god_speech_plain.slice(0,600))}${e.god_speech_plain.length>600?"…":""}</div></div>`;
        h+=`<div class="sect"><div class="h">действие</div>${esc(e.god_action)}</div>`;
        h+=`<div class="sect"><div class="h">о чём речь</div>${esc(e.summary_ru)}</div>`;
        h+=`<div class="src">источник: ${top[1]} ${e.span.start}–${e.span.end}</div>`;
      } else {
        h+=`<div class="note">В корпусе нет релевантного прецедента для этой реплики.</div>`;
      }
      const out=Object.entries(probs).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k,v])=>`<span class="tag ${k}">${k} ${(v*100).toFixed(0)}%</span>`).join("");
      h+=`<div class="src">ожидаемая реакция по триггеру ${trig}: ${out||"н/д"}</div></div>`;
      log.insertAdjacentHTML('beforeend',h);
    });
  };
  function draw(){ log.innerHTML=hist.map(([who,x])=>`<div class="ep" style="cursor:default"><div class="s">${who}</div><div>${esc(x)}</div></div>`).join(""); }
  document.getElementById('cq').addEventListener('keydown',ev=>{if(ev.key==='Enter')send()});
}
