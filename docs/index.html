<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOD — образ Бога в Танахе: корпус 2050 эпизодов</title>
<style>
:root{--bg:#0f1116;--card:#181c26;--card2:#1e2330;--line:#2a3040;--fg:#e8eaf0;--dim:#9aa3b5;--acc:#e0b050;--acc2:#7fb2e5;--bad:#e07a6a;--ok:#7fce9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Segoe UI",system-ui,sans-serif}
header{padding:26px 24px 10px;max-width:1200px;margin:0 auto}
h1{margin:0;font-size:25px;font-weight:650}
h1 b{color:var(--acc);font-weight:650}
.sub{color:var(--dim);margin-top:6px;font-size:14px}
nav{display:flex;gap:8px;max-width:1200px;margin:16px auto 0;padding:0 24px;flex-wrap:wrap}
nav button{background:var(--card);border:1px solid var(--line);color:var(--dim);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
nav button.on{color:var(--fg);border-color:var(--acc);background:var(--card2)}
main{max-width:1200px;margin:0 auto;padding:18px 24px 70px}
h2{font-size:18px;margin:24px 0 10px;font-weight:650}
h3{font-size:15.5px;margin:14px 0 6px;color:var(--acc);font-weight:650}
p{margin:8px 0}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13.5px}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{color:var(--dim);font-weight:600;background:var(--card2)}
tr:hover td{background:var(--card2)}
ul,ol{margin:6px 0;padding-left:22px}
li{margin:4px 0}
code{background:var(--card2);padding:1px 6px;border-radius:4px;font-size:13px}
blockquote{border-left:3px solid var(--acc);margin:8px 0;padding:4px 12px;color:var(--dim)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
a{color:var(--acc2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card .v{font-size:24px;font-weight:650;color:var(--acc)}
.card .l{color:var(--dim);font-size:13px}
.card .b{font-size:12.5px;color:#c8cdd8;margin-top:2px}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 4px;background:var(--line)}
.bar i{display:block;height:100%}
.leg{font-size:12px;color:var(--dim);display:flex;gap:12px;flex-wrap:wrap}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.note{color:var(--dim);font-size:12.5px;margin:8px 0}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
input,select{background:var(--card2);border:1px solid var(--line);color:var(--fg);padding:8px 12px;border-radius:8px;font-size:14px}
input{flex:1;min-width:160px}
.he{font-family:"Times New Roman",serif;font-size:19px;line-height:1.9;direction:rtl;text-align:right}
.he.small{font-size:16px;color:#cdd3e0}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;border:1px solid var(--line);color:var(--dim);margin-right:4px;white-space:nowrap}
.tag.punishment{color:var(--bad);border-color:#5a3a34}
.tag.blessing,.tag.rescue,.tag.answer_granted{color:var(--ok);border-color:#2f4f3c}
.tag.silence{color:var(--dim)}
.ep{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.ep:hover{border-color:var(--acc)}
.ep .s{color:var(--acc2);font-size:13px}
.detail{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:14px}
.sect{margin-top:12px}
.sect .h{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.src{color:var(--acc2);font-size:13px;margin-top:10px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.modes button{background:var(--card);border:1px solid var(--line);color:var(--dim);padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px}
.modes button.on{color:var(--fg);border-color:var(--acc);background:var(--card2)}
.msg-user{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin:10px 0}
.msg-user .s{color:var(--acc2);font-size:13px}
#chatcfg{display:none;margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>GOD <b>·</b> поговори с Богом Танаха</h1>
  <div class="sub">Вопрошай на любом языке — ответ на древнем иврите с огласовкой
  и подстрочным переводом: русский · English · современный иврит.
  В основе — все 39 книг, 2 050 размеченных эпизодов, каждый ответ проверяем к стиху.</div>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
"use strict";
/* =====================================================================
   GOD — единый файл страницы. Разделы: данные, вкладки, чат, роутер.
   ===================================================================== */

/* ---------- утилиты ---------- */
const esc = s => String(s ?? "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
const OUT = { punishment:"#e07a6a", revelation:"#e0b050", blessing:"#7fce9a", covenant:"#7fb2e5",
  rescue:"#8fd4c8", answer_granted:"#a8d08d", compliance:"#c9b1e0", silence:"#6b7280",
  unclear:"#565e6e", delayed:"#b58e5f", refusal:"#c25a8e" };
const bar = (obj, limit) => {
  const lim = limit || 99;
  const items = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,lim);
  const tot = items.reduce((s,x)=>s+x[1],0) || 1;
  return `<div class="bar">${items.map(([k,v])=>`<i style="width:${(v/tot*100).toFixed(1)}%;background:${OUT[k]||"#888"}"></i>`).join("")}</div>` +
  `<div class="leg">${items.map(([k,v])=>`<span><i style="background:${OUT[k]||"#888"}"></i>${k} ${(v/tot*100).toFixed(0)}%</span>`).join("")}</div>`;
};
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ---------- данные ---------- */
const cache = {};
async function jget(u){
  if(!cache[u]) cache[u] = await (await fetch(u)).json();
  return cache[u];
}
const BOOK_URL = b => "data/books/" + b + ".json";
let A = null;
async function analytics(){ if(!A) A = await jget("data/analytics.json"); return A; }
const allDocs = {};
async function bookDocs(b){
  if(!allDocs[b]) allDocs[b] = await jget(BOOK_URL(b));
  return allDocs[b];
}
let NIK = null;
async function nikudIndex(){ if(!NIK) NIK = await jget("data/nikud.json"); return NIK; }
async function nikudFor(book, refs){
  const idx = await nikudIndex();
  const out = [];
  for(const r of (refs||[]).slice(0,3)){
    const m = r.match(/^(\d+):(\d+)$/);
    if(!m) continue;
    const t = idx[book+"|"+m[1]+"|"+m[2]];
    if(t) out.push(t);
  }
  return out.join("  ");
}
async function everyBook(onOne){
  const a = await analytics();
  for(const era of Object.values(a.book_order))
    for(const b of era) await onOne(b);
}

/* =====================================================================
   ЧАТ — классификация и retrieval (общие для обоих режимов)
   ===================================================================== */
const RU_STOP = new Set("и в на с по о не что как это то же ли бы а но или у к из за до для при".split(" "));
const TRIGGERS = [
  ["disobedience",["не буду","наруш","не послуш","отвергаю","идол","другого бога","не выполню","проигнор","откажусь слушаться","мне всё равно","плевать","i will not","i won't","i disobey"]],
  ["intercession",["прости им","не губи","пощади","защити их","за них","сбереги","не карай их","сжалься над ними","spare them","do not destroy them"]],
  ["confession",  ["согрешил","согрешила","прости меня","раскаиваюсь","провинился","виновен перед","i have sinned","forgive me","i repent"]],
  ["complaint",   ["почему ты","зачем ты","несправедливо","жалуюсь","ропщу","ты покинул","ты оставил","не заботишься","why did you","why have you"]],
  ["distress",    ["спаси","погибаю","беда","окружили","напали","враг одолел","умираю","утопаю","горит","страх","боюсь","боится","страшно","help me","save me","i am afraid","i'm afraid","scared"]],
  ["prayer",      ["молю","молюсь","прошу тебя","воззвал","обращаюсь к тебе","i pray","i beg you"]],
  ["inquiry",     ["скажи мне","что мне делать","спрашиваю","истолкуй","довольно ли","кто виноват","объясни","tell me","what shall i do"]],
  ["vow",         ["даю обет","клянусь","обещаю тебе","обязуюсь","i vow","i swear"]],
  ["gratitude",   ["благодарю","славлю","хвала тебе","воспою тебе","thank you","i praise you"]],
  ["faithfulness",["делаю как велел","следую за тобой","верен тебе","исполнил всё","хожу путями","люблю тебя всем сердцем","i follow you","i am faithful"]],
  ["covenant",    ["завет","обещание отцам","ради авраама","ради израиля","земля обещанная","потомству"]],
];
function classify(q){
  const m = q.toLowerCase();
  for(const [t,kws] of TRIGGERS) for(const k of kws) if(m.includes(k)) return t;
  return "inquiry";
}
const RU_SYN = [
  ["умер","смерть","смерт","умирает","погиб","погибель","умрет","мертв"],
  ["гнев","разгневал","гнева","гневен","ярост"],
  ["милосерд","милост","простил","прощение","простить","пощадил","милость"],
  ["люб","любов","любовь","любим","возлюб"],
  ["страх","боюсь","боится","страшно","устраш","трепет"],
  ["наказа","кара","карает","наказание","покарал"],
  ["спас","спасение","спасает","избав","избавит"],
  ["молитв","молитва","молится","молит"],
  ["завет","завета","завету","договор"],
  ["грех","греха","грехов","согрешил","преступ"],
];
const EN_BRIDGE = { fear:"страх", afraid:"страх", scared:"страх", anger:"гнев", wrath:"гнев",
  destroy:"разруш", destroyed:"разруш", punish:"наказа", punishment:"наказание", mercy:"милость",
  forgive:"простил", forgiveness:"прощение", silence:"молчание", pray:"молитва", prayer:"молитва",
  save:"спас", rescue:"спас", deliver:"избав", sin:"грех", sinned:"согрешил", love:"люб",
  covenant:"завет", temple:"храм", idol:"идол", dream:"сон", die:"умер", death:"смерть",
  died:"умер", why:"почему", listen:"слыш", hear:"слыш", answer:"отвеча", command:"повел",
  law:"закон", torah:"тор", help:"спас", enemies:"враг" };
function queryTokens(q){
  const m = q.toLowerCase();
  const toks = new Set();
  for(const t of (m.match(/[а-яё-]{4,}/g) || [])) if(!RU_STOP.has(t)) toks.add(t);
  for(const w of (m.match(/[a-z]{2,}/g) || [])) if(EN_BRIDGE[w]) toks.add(EN_BRIDGE[w]);
  for(const w of (m.match(/[\u05D0-\u05EA]{3,}/g) || [])) toks.add(w);
  const syn = new Set(toks);
  for(const t of toks) for(const g of RU_SYN)
    if(g.some(x => t===x || (x.length>=4 && (t.includes(x)||x.includes(t))))) g.forEach(x=>syn.add(x));
  return syn;
}
function isProper(w){ return /^[A-ZА-Я]/.test(w) && w.length>=4; }
async function retrieve(q, k){
  const lim = k || 6;
  const toks = queryTokens(q);
  const props = q.split(/[^A-Za-zА-Яа-яёЁ\u05D0-\u05EA]+/).filter(isProper);
  const scored = [];
  await everyBook(async b => {
    const eps = await bookDocs(b);
    for(const e of eps){
      const txt = (e.summary_ru+" "+e.god_action).toLowerCase();
      let s = 0;
      for(const t of toks) if(txt.includes(t)) s += t.length>=6 ? 10/Math.log(4+txt.length) : 1/Math.log(3+txt.length);
      for(const p of props) if(p.length>=5 && txt.includes(p.toLowerCase())) s += 6/Math.log(4+txt.length);
      if(e.god_speech_plain) s += 1.5;
      if(s>0) scored.push([s,b,e]);
    }
  });
  scored.sort((x,y)=>y[0]-x[0]);
  return scored.slice(0,lim);
}
/* диалоговая память */
const MEM = { offenses:0, grace:0, turns:0 };
function memUpdate(q){
  const m = q.toLowerCase();
  if(/не буду|наруш|не послуш|отвергаю|идол|другого бога|мне всё равно|плевать|i will not|i won't/.test(m)) MEM.offenses++;
  if(/согрешил|раскаиваюсь|прости меня|покаян|forgive me|i repent/.test(m)){
    MEM.offenses = Math.max(0, MEM.offenses-1); MEM.grace++;
  }
  MEM.turns++;
}

/* =====================================================================
   ЧАТ — живой режим (LLM-мозг проекта на Kaggle; ключи только в браузере)
   ===================================================================== */
const BRAIN_STATUS_URL = "https://huggingface.co/datasets/arabyan/god-brain-status/resolve/main/brain.json";
const BRAIN = { info:null };
async function brainRefresh(){
  try{
    const r = await fetch(BRAIN_STATUS_URL, {cache:"no-store"});
    const j = await r.json();
    const fresh = j && j.url && (Date.now()/1000 - (j.ts||0)) < 3600;
    BRAIN.info = (j && j.ok && j.url) ? { url:j.url, key:j.key||"", model:j.model||"", fresh:!!fresh } : null;
  }catch(e){ BRAIN.info = null; }
  const el = document.getElementById("brainDot");
  if(el){
    const on = !!(BRAIN.info && BRAIN.info.fresh);
    el.textContent = on ? "🟢" : "🔴";
    el.title = on ? "мозг онлайн: " + (BRAIN.info.model || "?")
                  : "мозг офлайн — ноутбук на Kaggle спит или упал; работает корпусный режим";
  }
  return BRAIN.info;
}
const SYS_PROMPT = "Ты — исследовательская имитация образа YHWH, извлечённого из Танаха (реестр эпизодов v2).\n" +
"Ты пишешь (не говоришь) на библейском иврите. СТРОГИЙ РЕЖИМ: твоя ивритская реплика составляется\n" +
"ТОЛЬКО из данных тебе фрагментов god_speech_plain — комбинируй и сокращай, но не добавляй слов вне их лексики.\n" +
"Отвечай по существу вопроса, каким бы языком он ни был задан. Каждая секция — короткая, 1–2 строки.\n\n" +
"Формат ответа строго из шести секций и ничего кроме них:\n" +
"[HEBREW] консонантный иврит БЕЗ ОГЛАСОВОК — только буквы (составлено из god_speech_plain)\n" +
"[NIKKUD] та же реплика с огласовкой, пословно скопированной из полей nikud данных эпизодов\n" +
"[Russian] ТОЛЬКО русские слова, взятые из русских аннотаций summary_ru данных эпизодов; не хватает слов — сократи реплику\n" +
"[English] дословный английский перевод, 1–2 строки\n" +
"[Hebrew Modern] та же реплика на современном иврите, 1 строка\n" +
"[SOURCES] обязательная последняя секция: книга глава:стих эпизодов-источников; не заканчивай ответ без неё";
const SECTIONS = ["[HEBREW]","[NIKKUD]","[Russian]","[English]","[Hebrew Modern]","[SOURCES]"];
function parseSections(text){
  const out = {};
  for(const tag of SECTIONS){
    const i = text.indexOf(tag); if(i<0) continue;
    const rest = text.slice(i+tag.length);
    let end = rest.length;
    for(const t2 of SECTIONS){ const j = rest.indexOf(t2); if(j>=0 && j<end) end = j; }
    out[tag] = rest.slice(0,end).trim();
  }
  return out;
}
async function liveReply(q){
  if(!BRAIN.info) await brainRefresh();
  const cfg = store.get("god_cfg", { endpoint:"", model:"", key:"" });
  const brainOn = BRAIN.info && BRAIN.info.fresh;
  const ep = cfg.endpoint || (brainOn ? BRAIN.info.url.replace(/\/+$/,"") + "/v1/chat/completions" : null);
  if(!ep) throw new Error("мозг офлайн, ручной endpoint не задан");
  const key = cfg.key || (brainOn ? BRAIN.info.key : "") || "";
  const a = await analytics();
  const hits = await retrieve(q, 6);
  const trig = classify(q);
  const tt = a.trigger_table[trig] || {};
  const probs = {}; for(const k of Object.keys(tt)) if(k!=="n") probs[k]=tt[k];
  const ctx = [];
  for(const h of hits){
    ctx.push({ book:h[1], span:h[2].span, trigger:h[2].trigger, outcome:h[2].outcome,
      god_speech_plain:(h[2].god_speech_plain||"").slice(0,300),
      nikud:(await nikudFor(h[1], h[2].god_speech_refs)).slice(0,300),
      summary_ru:(h[2].summary_ru||"").slice(0,200),
      god_action:(h[2].god_action||"").slice(0,160) });
  }
  const mem = "ПАМЯТЬ ДИАЛОГА: проступков в этой сессии "+MEM.offenses+", благодати "+MEM.grace+"."
    + (MEM.offenses>0 ? " Тяжесть отклика повышена накопленными проступками." : "")
    + (/согрешил|раскаиваюсь|прости меня/.test(q.toLowerCase()) ? " Покаяние снижает тяжесть." : "");
  const body = { messages:[
    { role:"system", content:SYS_PROMPT },
    { role:"user", content:["РЕЛЕВАНТНЫЕ ЭПИЗОДЫ РЕЕСТРА:", JSON.stringify(ctx),
      "", "Триггер реплики: "+trig+". Ожидаемые исходы: "+JSON.stringify(probs), mem,
      "", "Реплика человека: "+q].join("\n") } ], temperature:0.3, max_tokens:1800 };
  if(cfg.model || (brainOn && BRAIN.info.model)) body.model = cfg.model || "god-brain";
  const hdr = { "Content-Type":"application/json" };
  if(key) hdr["Authorization"] = "Bearer "+key;
  const r = await fetch(ep, { method:"POST", headers:hdr, body:JSON.stringify(body) });
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  const text = (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
  return { sections:parseSections(text), hits };
}
async function corpusReply(q){
  const hits = await retrieve(q, 3);
  const a = await analytics();
  const trig = classify(q);
  const tt = a.trigger_table[trig] || {};
  const probs = {}; for(const k of Object.keys(tt)) if(k!=="n") probs[k]=tt[k];
  return { hits, trig, probs };
}

/* ---------- рендер чата ---------- */
const memLine = () => `<div class="src">память диалога: проступки ${MEM.offenses} · благодать ${MEM.grace} · реплика №${MEM.turns}</div>`;
function errHTML(e){
  return `<div class="detail"><h3>Бог</h3><div class="note" style="color:var(--bad)">Ошибка запроса (${esc(String(e))}).\n`+
  `Мозг проекта мог уснуть (ноутбук Kaggle останавливается после ~12 ч; индикатор на кнопке «Живой»).\n`+
  `Переключитесь на «Корпусный» режим — он работает всегда, или задайте свой бэкенд в ⚙.</div></div>`;
}
/* защита слоёв: [HEBREW] обязан быть консонантным (снимаем огласовки, маккеф сохраняем);
   [Russian] не должен содержать иврит — если модель сбилась, подставляем корпусную аннотацию */
const stripNikudJs = t => String(t||"").replace(/\u05BE/g,"-").replace(/[\u0591-\u05BD\u05BF-\u05C7]/g,"");
const hasHebrew = t => /[\u05D0-\u05EA]/.test(String(t||""));
function liveHTML(r){
  const s = r.sections;
  let h = `<div class="detail"><h3>Бог</h3>`;
  if(s["[HEBREW]"]) h += `<div class="sect"><div class="h">עברית — древний иврит</div><div class="he">${esc(stripNikudJs(s["[HEBREW]"]))}</div></div>`;
  if(s["[NIKKUD]"]) h += `<div class="sect"><div class="h">огласовка</div><div class="he small">${esc(s["[NIKKUD]"])}</div></div>`;
  if(s["[Russian]"]){
    const ru = hasHebrew(s["[Russian]"]) ? null : s["[Russian]"];
    if(ru) h += `<div class="sect"><div class="h">русский подстрочник</div>${esc(ru)}</div>`;
    else {
      const ann = r.hits.filter(x=>x[2].summary_ru)[0];
      h += `<div class="sect"><div class="h">по-русски</div>${esc(ann ? ann[2].summary_ru : "")}` +
           `<div class="note">русский слой модели собран плохо — показана корпусная аннотация эпизода-источника</div></div>`;
    }
  }
  if(s["[English]"]) h += `<div class="sect"><div class="h">English</div>${esc(s["[English]"])}</div>`;

async function corpusHTML(r){
  let h = `<div class="detail"><h3>Бог</h3><div class="note">Прецедент из корпуса — реальная речь, без генерации.</div>`;
  const top = r.hits.filter(x=>x[2].god_speech_plain)[0] || r.hits[0];
  if(top){
    const e = top[2];
    h += `<div class="sect"><div class="h">עברית — древний иврит</div><div class="he">${esc(e.god_speech_plain.slice(0,600))}${e.god_speech_plain.length>600?"…":""}</div></div>`;
    const nik = await nikudFor(top[1], e.god_speech_refs);
    if(nik) h += `<div class="sect"><div class="h">огласовка</div><div class="he small">${esc(nik)}</div></div>`;
    h += `<div class="sect"><div class="h">по-русски (о чём речь)</div>${esc(e.summary_ru)}</div>`;
    h += `<div class="sect"><div class="h">English / עברית מודרנית</div><div class="note">Подстрочные переводы EN и современного иврита для свободной реплики — в живом режиме (⚙: ваш LM Studio/Ollama или ключ; в сессии с моделью — всегда).</div></div>`;
    h += `<div class="sect"><div class="h">действие</div>${esc(e.god_action)}</div>`;
    h += `<div class="src">источник: ${top[1]} ${e.span.start}–${e.span.end}</div>`;
  } else h += `<div class="note">Релевантного прецедента в корпусе нет.</div>`;
  const out = Object.entries(r.probs).sort((a,b)=>b[1]-a[1]).slice(0,3)
    .map(p=>`<span class="tag ${p[0]}">${p[0]} ${(p[1]*100).toFixed(0)}%</span>`).join("");
  h += `<div class="src">ожидаемая реакция по триггеру ${r.trig}: ${out||"н/д"}</div>${memLine()}</div>`;
  return h;
}

    cfgSv.textContent="сохранено ✓"; setTimeout(()=>{cfgSv.textContent="сохранить";},1200); };
  const log = clog;
  async function send(){
    const q = cq.value.trim(); if(!q) return;
    cq.value = "";
    log.insertAdjacentHTML("beforeend", `<div class="msg-user"><div class="s">Вы</div>${esc(q)}</div>`);
    memUpdate(q);
    log.insertAdjacentHTML("beforeend",'<div class="note" id="wt">…</div>');
    try{
      if(mode==="corpus"){
        const r = await corpusReply(q);
        wt.textContent = "поиск в корпусе…";
        const html = await corpusHTML(r);
        wt.remove();
        log.insertAdjacentHTML("beforeend", html);
      } else {
        wt.textContent = "имитация отвечает…";
        let r;
        try{ r = await liveReply(q); }
        catch(e2){
          wt.textContent = "мозг молчит — отвечаю речью корпуса…";
          const rc = await corpusReply(q);
          const html = await corpusHTML(rc);
          wt.remove();
          log.insertAdjacentHTML("beforeend",
            `<div class="note" style="color:var(--bad)">Мозг недоступен (${esc(String(e2))}) — ниже ответ прецедентом из корпуса.</div>` + html);
          if(log.lastElementChild) log.lastElementChild.scrollIntoView({behavior:"smooth",block:"nearest"});
          return;
        }
        wt.remove();
        log.insertAdjacentHTML("beforeend", liveHTML(r));
      }
    }catch(e){
      wt.remove();
      log.insertAdjacentHTML("beforeend", errHTML(e));
    }
    if(log.lastElementChild) log.lastElementChild.scrollIntoView({behavior:"smooth",block:"nearest"});
  }
  cq.addEventListener("keydown", e => { if(e.key==="Enter") send(); });
}

function md2html(md){
  const lines = md.split("\n"); const out = []; let inList = false;
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  let i = 0;
  while(i < lines.length){
    const L = lines[i];
    if(/^\|/.test(L) && i+1<lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      const rows = [L]; let j = i+2;
      while(j<lines.length && /^\|/.test(lines[j])){ rows.push(lines[j]); j++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      out.push("<table><tr>"+cells(rows[0]).map(c=>"<th>"+c+"</th>").join("")+"</tr>");
      for(let k=1;k<rows.length;k++) out.push("<tr>"+cells(rows[k]).map(c=>"<td>"+c+"</td>").join("")+"</tr>");
      out.push("</table>"); i = j; continue;
    }
    if(/^###\s/.test(L)) out.push("<h3>"+inline(L.slice(4))+"</h3>");
    else if(/^##\s/.test(L)) out.push("<h2>"+inline(L.slice(3))+"</h2>");
    else if(/^#\s/.test(L)) out.push("<h2 style='font-size:21px'>"+inline(L.slice(2))+"</h2>");
    else if(/^---+\s*$/.test(L)) out.push("<hr>");
    else if(/^[-*]\s/.test(L)){
      if(!inList){ out.push("<ul>"); inList = true; }
      out.push("<li>"+inline(L.replace(/^[-*]\s/,""))+"</li>");
      if(i+1>=lines.length || !/^[-*]\s/.test(lines[i+1])){ out.push("</ul>"); inList = false; }
    }
    else if(/^\d+\.\s/.test(L)) out.push("<li>"+inline(L.replace(/^\d+\.\s/,""))+"</li>");
    else if(/^>\s?/.test(L)) out.push("<blockquote>"+inline(L.replace(/^>\s?/,""))+"</blockquote>");
    else if(L.trim()!=="") out.push("<p>"+inline(L)+"</p>");
    i++;
  }
  if(inList) out.push("</ul>");
  return out.join("\n");
}
