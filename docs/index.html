<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GOD — образ Бога в Танахе: корпус 2050 эпизодов</title>
<style>
/* =====================================================
   GOD — THE SCROLL OF MIDNIGHT
   Visual language: ancient manuscript meets modern glassmorphism
   Palette: Tabernacle gold (#c9a84c) on midnight indigo
   ===================================================== */

@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+Hebrew:wght@400;600;700&display=swap");

:root {
  --bg: #080c16;
  --bg2: #0d1322;
  --bg3: #121a2e;
  --card: rgba(18, 26, 46, 0.72);
  --card-solid: #121a2e;
  --card2: rgba(24, 34, 58, 0.8);
  --line: rgba(201, 168, 76, 0.12);
  --line2: rgba(201, 168, 76, 0.25);
  --fg: #e8e4d8;
  --fg2: #d4cfc0;
  --dim: #8a94a8;
  --dim2: #5a6a80;
  --acc: #c9a84c;
  --acc-bright: #e8d4a0;
  --acc-dim: rgba(201, 168, 76, 0.3);
  --acc2: #7aa8cc;
  --bad: #c75450;
  --ok: #6db37c;
  --gold-grad: linear-gradient(135deg, #c9a84c 0%, #e8d4a0 50%, #c9a84c 100%);
  --card-grad: linear-gradient(145deg, rgba(18,26,46,.75) 0%, rgba(14,20,36,.6) 100%);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --glow: 0 0 20px rgba(201, 168, 76, 0.1), 0 0 60px rgba(201, 168, 76, 0.05);
  --font-display: "Playfair Display", "Georgia", serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-hebrew: "Noto Serif Hebrew", "Times New Roman", serif;
  --radius: 14px;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--fg);
  font: 15px/1.7 var(--font-body);
  background: var(--bg);
  min-height: 100vh;
}

/* ===== BACKGROUND: Midnight scroll ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,16,40,.8) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(10,30,50,.5) 0%, transparent 50%),
    radial-gradient(ellipse 50% 30% at 20% 60%, rgba(20,14,36,.4) 0%, transparent 50%),
    linear-gradient(180deg, #080c16 0%, #0d1322 50%, #12102a 100%);
}

body::after { display:none; }


/* ===== HEADER: The golden inscription ===== */
header {
  padding: 40px 24px 16px;
  max-width: 1160px;
  margin: 0 auto;
  position: relative;
  text-align: center;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--fg);
  line-height: 1.2;
}

h1 b {
  color: var(--acc);
  font-weight: 800;
}

h1 b::after {
  content: '';
  display: block;
  width: 120px;
  height: 2px;
  margin: 4px auto 0;
  background: var(--gold-grad);
  border-radius: 1px;
  opacity: 0.6;
}

.sub {
  color: var(--dim);
  margin-top: 12px;
  font-size: 14.5px;
  font-weight: 300;
  line-height: 1.7;
  max-width: 720px;
}

/* Language selector */
.langs {
  display: flex;
  gap: 4px;
  margin-top: 14px;
  justify-content: center;
}

.langs button {
  background: transparent;
  border: 1px solid rgba(201, 168, 76, 0.2);
  color: var(--dim);
  padding: 4px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.25s ease;
}

.langs button:hover {
  border-color: var(--acc);
  color: var(--fg);
}

.langs button.on {
  background: rgba(201, 168, 76, 0.12);
  border-color: var(--acc);
  color: var(--acc-bright);
  font-weight: 600;
}

/* ===== NAV: The golden tabernacle entrance ===== */
nav {
  display: flex;
  gap: 6px;
  max-width: 1160px;
  margin: 20px auto 0;
  padding: 0 24px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}

nav button {
  background: transparent;
  border: 1px solid transparent;
  color: var(--dim);
  padding: 8px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: var(--font-body);
  transition: all 0.3s ease;
  position: relative;
}

nav button::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--gold-grad);
  border-radius: 1px;
  transition: all 0.3s ease;
  transform: translateX(-50%);
}

nav button:hover {
  color: var(--fg);
}

nav button:hover::after {
  width: 60%;
}

nav button.on {
  color: var(--acc-bright);
  font-weight: 600;
}

nav button.on::after {
  width: 80%;
  opacity: 1;
}

/* ===== MAIN: The sacred text ===== */
main {
  max-width: 1160px;
  margin: 0 auto;
  padding: 24px 24px 80px;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  font-family: var(--font-display);
  font-size: 22px;
  margin: 28px 0 14px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.3px;
}

h2::after {
  content: '';
  display: block;
  width: 40px;
  height: 2px;
  margin: 6px auto 0;
  background: var(--gold-grad);
  border-radius: 1px;
  opacity: 0.5;
}

h3 {
  font-size: 15px;
  margin: 16px 0 8px;
  color: var(--acc);
  font-weight: 600;
  font-family: var(--font-body);
}

p { margin: 8px 0; }

/* ===== TABLE: The ledger of destinies ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  font-size: 13.5px;
  box-shadow: var(--shadow);
}

th, td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid rgba(201, 168, 76, 0.06);
}

th {
  color: var(--acc);
  font-weight: 600;
  background: rgba(201, 168, 76, 0.06);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

tr:hover td {
  background: rgba(201, 168, 76, 0.04);
}

tr:last-child td { border-bottom: none; }

/* ===== CARDS: Glassmorphism scrolls ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.card {
  background: var(--card-grad);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--gold-grad);
  opacity: 0.25;
  border-radius: var(--radius) var(--radius) 0 0;
}

.card:hover {
  border-color: var(--line2);
  transform: translateY(-2px);
  box-shadow: var(--shadow), var(--glow);
}

.card .v {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  color: var(--acc);
  line-height: 1;
  text-align: center;
}

.card .l {
  color: var(--dim);
  font-size: 12.5px;
  margin-top: 6px;
  font-weight: 500;
  text-align: center;
}

.card .b {
  font-size: 12px;
  color: var(--fg2);
  margin-top: 4px;
  opacity: 0.8;
}

/* ===== BAR: The scales of destiny ===== */
.bar {
  display: flex;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin: 10px 0 6px;
  background: rgba(0, 0, 0, 0.3);
}

.bar i { display: block; height: 100%; }

.leg {
  font-size: 11.5px;
  color: var(--dim);
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.leg i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}

/* ===== NOTE: The whispered word ===== */
.note {
  color: var(--dim);
  font-size: 12.5px;
  margin: 10px 0;
  line-height: 1.6;
}

.note.waiting {
  color: var(--acc);
  animation: pulse 2s ease-in-out infinite;
  font-weight: 500;
}

@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ===== FILTERS ===== */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 12px 0 16px;
}

input, select {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--line);
  color: var(--fg);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-body);
  transition: all 0.3s ease;
}

input { flex: 1; min-width: 160px; }

input:focus, select:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
  outline: none;
}

input::placeholder { color: var(--dim2); }

/* ===== HEBREW: The sacred script ===== */
.he {
  font-family: var(--font-hebrew);
  font-size: 20px;
  line-height: 2;
  direction: rtl;
  text-align: right;
  color: #f0e8d8;
  padding: 12px 0;
}

.he.small { font-size: 16.5px; color: #d0c8b8; }

/* ===== TAGS: Seals of destiny ===== */
.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--line);
  color: var(--dim);
  margin-right: 4px;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.tag.punishment { color: var(--bad); border-color: rgba(199, 84, 80, 0.3); background: rgba(199, 84, 80, 0.06); }
.tag.blessing, .tag.rescue, .tag.answer_granted { color: var(--ok); border-color: rgba(109, 179, 124, 0.3); background: rgba(109, 179, 124, 0.06); }
.tag.silence { color: var(--dim); border-style: dashed; }

/* ===== EPISODES: The chronicles ===== */
.ep {
  background: var(--card);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.ep:hover {
  border-color: var(--line2);
  transform: translateX(4px);
  box-shadow: var(--glow);
}

.ep .s { color: var(--acc2); font-size: 12.5px; font-weight: 500; }

/* ===== DETAIL: The unveiled mystery ===== */
.detail {
  background: var(--card-grad);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-top: 16px;
  box-shadow: var(--shadow);
  animation: fadeIn 0.3s ease;
}

.sect { margin-top: 16px; }

.sect .h {
  font-size: 10.5px;
  color: var(--acc);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 600;
  opacity: 0.7;
}

.src {
  color: var(--acc2);
  font-size: 13px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

/* ===== MESSAGE: The human utterance ===== */
.msg-user {
  background: rgba(201, 168, 76, 0.06);
  border: 1px solid rgba(201, 168, 76, 0.15);
  border-radius: 12px;
  padding: 12px 16px;
  margin: 12px 0;
}

.msg-user .s {
  color: var(--acc);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}

/* ===== ACTION: The divine deed ===== */
div[style*="border-left:3px solid var(--acc)"] {
  border-left: 3px solid var(--acc) !important;
  background: rgba(201, 168, 76, 0.05);
  padding: 12px 14px !important;
  border-radius: 0 10px 10px 0;
  margin: 12px 0 !important;
}

/* ===== BRAIN STATE: The divine pulse ===== */
.modes {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 14px 0;
  padding: 10px 14px;
  background: var(--card);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
}

#brainDot { font-size: 16px; }

#brainState { font-weight: 500; }

/* ===== OTHER ===== */
ul, ol { margin: 8px 0; padding-left: 22px; }
li { margin: 6px 0; }

code {
  background: rgba(201, 168, 76, 0.08);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--acc-bright);
  font-family: 'Cascadia Code', 'Consolas', monospace;
}

blockquote {
  border-left: 3px solid var(--acc);
  margin: 12px 0;
  padding: 8px 16px;
  color: var(--dim);
  background: rgba(201, 168, 76, 0.04);
  border-radius: 0 8px 8px 0;
}

hr {
  border: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line2), transparent);
  margin: 24px 0;
}

a { color: var(--acc2); transition: color 0.2s; }
a:hover { color: var(--acc-bright); }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(201, 168, 76, 0.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(201, 168, 76, 0.35); }

/* ===== MOBILE ===== */
@media (max-width: 640px) {
  header { padding: 28px 16px 12px; }
  h1 { font-size: 24px; }
  nav { padding: 0 16px; }
  main { padding: 16px 16px 60px; }
  .he { font-size: 17px; }
  .card .v { font-size: 26px; }
  th, td { padding: 8px 10px; }
}

</style>
</head>

"use strict";
/* =====================================================================
   GOD — единый файл страницы. Разделы: данные, вкладки, чат, роутер.
   ===================================================================== */

/* ---------- утилиты ---------- */
const esc = s => String(s ?? "").replace(/&/g,"&").replace(/</g,"<").replace(/>/g,">");
const OUT = { punishment:"#e07a6a", revelation:"#e0b050", blessing:"#7fce9a", covenant:"#7fb2e5",
  rescue:"#8fd4c8", answer_granted:"#a8d08d", compliance:"#c9b1e0", silence:"#6b7280",
  unclear:"#565e6e", delayed:"#b58e5f", refusal:"#c25a8e" };
const bar = (obj, limit) => {
  const lim = limit || 99;
  const items = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,lim);
  const tot = items.reduce((s,x)=>s+x[1],0) || 1;
  return `<div class="bar">${items.map(([k,v])=>`<i style="width:${(v/tot*100).toFixed(1)}%;background:${OUT[k]||"#888"}"></i>`).join("")}</div>` +
  `<div class="leg">${items.map(([k,v])=>`<span><i style="background:${OUT[k]||"#888"}"></i>${dn("out",k)} ${(v/tot*100).toFixed(0)}%</span>`).join("")}</div>`;
};
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

/* ---------- i18n: RU / EN / HE (совр. иврит) ---------- */

  destroy:"разруш", destroyed:"разруш", punish:"наказа", punishment:"наказание", mercy:"милость",

function queryTokens(q){
  const m = q.toLowerCase();
  const toks = new Set();
  for(const t of (m.match(/[а-яё-]{4,}/g) || [])) if(!RU_STOP.has(t)) toks.add(t);
  for(const w of (m.match(/[a-z]{2,}/g) || [])) if(EN_BRIDGE[w]) toks.add(EN_BRIDGE[w]);
  for(const w of (m.match(/[\u05D0-\u05EA]{3,}/g) || [])) toks.add(w);
  const syn = new Set(toks);
  for(const t of toks) for(const g of RU_SYN)
    if(g.some(x => t===x || (x.length>=4 && (t.includes(x)||x.includes(t))))) g.forEach(x=>syn.add(x));
  return syn;
}
function isProper(w){ return /^[A-ZА-Я]/.test(w) && w.length>=4; }
/* ---------- векторный retrieval: те же веса e5-small, что считали индекс ---------- */
let VECM = null;   // null = не пытались; false = недоступен (CDN/ошибка) — тогда чистая лексика
let EMBD = null;   // embeddings.json + деквантованные строки + карта ключей
async function vectorReady(){
  if(VECM !== null) return VECM;
  try{
    const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
    VECM = await pipeline("feature-extraction", "Xenova/multilingual-e5-small", { quantized: true });
  }catch(e){ VECM = false; }
  return VECM;
}
function dequant(row){
  const bin = atob(row.q), n = bin.length, out = new Float32Array(n);
  for(let i=0;i<n;i++) out[i] = (bin.charCodeAt(i) << 24 >> 24) * row.s / 127;  // int8 → float
  return out;
}
const cosv = (a,b) => { let d=0; for(let i=0;i<a.length;i++) d += a[i]*b[i]; return d; };
async function embIndex(){
  if(EMBD !== null) return EMBD;
  try{
    const j = await jget("data/embeddings.json");
    const map = {}; for(let i=0;i<j.meta.length;i++) map[j.meta[i].b+"|"+j.meta[i].s1] = i;
    EMBD = { j, map, vecs: new Array(j.rows.length) };
  }catch(e){ EMBD = false; }
  return EMBD;
}
const QCACHE = {};
async function embedQuery(q){
  const m = await vectorReady();
  if(!m) return null;
  if(!QCACHE[q]) QCACHE[q] = Array.from((await m("query: "+q, { pooling:"mean", normalize:true })).data);
  return QCACHE[q];
}
async function retrieve(q, k){
  const lim = k || 6;
  const toks = queryTokens(q);
  const props = q.split(/[^A-Za-zА-Яа-яёЁ\u05D0-\u05EA]+/).filter(isProper);
  const trig = classify(q);            // тип обращения выбирает эпизоды с тем же триггером:
  const scored = [];                    // «я боюсь» (distress) → эпизоды, где Бог ОТВЕЧАЕТ на беду
  const idx = await embIndex();
  const qv = idx ? await embedQuery(q) : null;
  const VEC_W = 2.0;                   // баланс: вектор поднимает абстракции, не топит ролевой сигнал; при 6.0 ломает роли (7/22 vs 18/22)
  const cosRows = [];                  // [entry, cos] — z-нормировка после полного прохода
  await everyBook(async b => {
    const eps = await bookDocs(b);
    for(const e of eps){
      const txt = (e.summary_ru+" "+e.god_action).toLowerCase();
      let s = 0;
      for(const t of toks) if(txt.includes(t)) s += t.length>=6 ? 10/Math.log(4+txt.length) : 1/Math.log(3+txt.length);
      for(const p of props) if(p.length>=5 && txt.includes(p.toLowerCase())) s += 6/Math.log(4+txt.length);
      if(e.god_speech_plain) s += 2.5;        // Бог говорил в эпизоде — материал для рекомбинации
      if(e.trigger === trig) s += 4;          // тот же тип обращения — главный буст голоса
      let cos = null;
      if(qv && idx){
        const ri = idx.map[b+"|"+e.span.start];
        if(ri !== undefined){
          if(!idx.vecs[ri]) idx.vecs[ri] = dequant(idx.j.rows[ri]);
          cos = cosv(qv, idx.vecs[ri]);
        }
      }
      const entry = [s,b,e];
      scored.push(entry);
      if(cos !== null) cosRows.push([entry, cos]);
    }
  });
  // z-нормировка косинусов: сырые cos e5 слипаются в полосу (~0.8) и не различают,
  // z = (cos-среднее)/std ранжирует относительно — полоса уходит
  if(cosRows.length > 20){
    const mean = cosRows.reduce((acc,x)=>acc+x[1],0)/cosRows.length;
    const std = Math.sqrt(cosRows.reduce((acc,x)=>acc+(x[1]-mean)*(x[1]-mean),0)/cosRows.length) || 1e-9;
    for(const [entry, cos] of cosRows){
      entry[0] += VEC_W * (cos-mean)/std;
      entry[3] = cos;                        // для отладки: сырой косинус в хвосте
    }
  }
  scored.sort((x,y)=>y[0]-x[0]);
  return scored.slice(0,lim);
}

const MEM = { offenses:0, grace:0, turns:0 };
function memUpdate(q){
  const m = q.toLowerCase();
  if(/не буду|наруш|не послуш|отвергаю|идол|другого бога|мне всё равно|плевать|i will not|i won't/.test(m)) MEM.offenses++;
  if(/согрешил|раскаиваюсь|прости меня|покаян|forgive me|i repent/.test(m)){
    MEM.offenses = Math.max(0, MEM.offenses-1); MEM.grace++;
  }
  MEM.turns++;
}

}
const SYS_PROMPT = "Ты — исследовательская имитация образа YHWH, извлечённого из Танаха (реестр эпизодов v2).\n" +
"Ты пишешь (не говоришь) на библейском иврите. СТРОГИЙ РЕЖИМ: твоя ивритская реплика составляется\n" +
"ТОЛЬКО из данных тебе фрагментов god_speech_plain — комбинируй и сокращай, но не добавляй слов вне их лексики.\n" +
"Отвечай по существу вопроса, каким бы языком он ни был задан. Каждая секция — короткая, 1–2 строки.\n\n" +
"Формат ответа: ровно шесть секций, ни одна не пропускается, ничего кроме них:\n" +
"[HEBREW] консонантный иврит БЕЗ ОГЛАСОВОК — только буквы (составлено из god_speech_plain)\n" +
"[NIKKUD] та же реплика с огласовкой, пословно скопированной из полей nikud данных эпизодов\n" +
"[Russian] ТОЛЬКО русские слова, взятые из русских аннотаций summary_ru данных эпизодов; не хватает слов — сократи реплику\n" +
"[English] дословный английский перевод, 1–2 строки\n" +
"[Hebrew Modern] та же реплика на современном иврите, 1 строка\n" +
"[SOURCES] обязательная последняя секция: книга глава:стих эпизодов-источников; не заканчивай ответ без неё";
const SECTIONS = ["[HEBREW]","[NIKKUD]","[Russian]","[English]","[Hebrew Modern]","[SOURCES]"];
function parseSections(text){
  const out = {};
  for(const tag of SECTIONS){
    const i = text.indexOf(tag); if(i<0) continue;
    const rest = text.slice(i+tag.length);
    let end = rest.length;
    for(const t2 of SECTIONS){ const j = rest.indexOf(t2); if(j>=0 && j<end) end = j; }
    out[tag] = rest.slice(0,end).trim();
  }
  return out;
}
async function liveReply(q){
  if(!BRAIN.info || !BRAIN.info.state) await brainRefresh();
  if(!BRAIN.info || BRAIN.info.state !== "on")
    throw new Error(BRAIN.info && BRAIN.info.state === "starting"
      ? "голос Бога поднимается — минуты" : "голос Бога спит");
  const cfg = store.get("god_cfg", { endpoint:"", model:"", key:"" });
  const ep = cfg.endpoint || BRAIN.info.url.replace(/\/+$/,"") + "/v1/chat/completions";
  const key = cfg.key || BRAIN.info.key || "";
  const a = await analytics();
  const hits = await retrieve(q, 6);
  const trig = classify(q);
  const tt = a.trigger_table[trig] || {};
  const probs = {}; for(const k of Object.keys(tt)) if(k!=="n") probs[k]=tt[k];
  const ctx = [];
  for(const h of hits){
    ctx.push({ book:h[1], span:h[2].span, trigger:h[2].trigger, outcome:h[2].outcome,
      god_speech_plain:(h[2].god_speech_plain||"").slice(0,300),
      nikud:(await nikudFor(h[1], h[2].god_speech_refs)).slice(0,300),
      summary_ru:(h[2].summary_ru||"").slice(0,200),
      god_action:(h[2].god_action||"").slice(0,160) });
  }
  const mem = "ПАМЯТЬ ДИАЛОГА: проступков в этой сессии "+MEM.offenses+", благодати "+MEM.grace+"."
    + (MEM.offenses>0 ? " Тяжесть отклика повышена накопленными проступками." : "")
    + (/согрешил|раскаиваюсь|прости меня/.test(q.toLowerCase()) ? " Покаяние снижает тяжесть." : "");
  const body = { messages:[
    { role:"system", content:SYS_PROMPT },
    { role:"user", content:["РЕЛЕВАНТНЫЕ ЭПИЗОДЫ РЕЕСТРА:", JSON.stringify(ctx),
      "", "Триггер реплики: "+trig+". Ожидаемые исходы: "+JSON.stringify(probs), mem,
      "", "Реплика человека: "+q,
      "", "Напоминание: ответ обязан кончаться секцией [SOURCES] со стихами-источниками."].join("\n") } ], temperature:0.3, max_tokens:1800 };
  body.model = cfg.model || "god-brain";
  const hdr = { "Content-Type":"application/json" };
  if(key) hdr["Authorization"] = "Bearer "+key;
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 75000);   // мёртвый туннель не должен висеть вечно
  let r;
  try{
    r = await fetch(ep, { method:"POST", headers:hdr, body:JSON.stringify(body), signal:ac.signal });
  }catch(e){
    brainRefresh();   // туннель мог смениться — сразу обновляем адрес для следующей попытки
    throw new Error("мозг не ответил за 75 с (туннель мог смениться)");
  }finally{ clearTimeout(timer); }
  if(!r.ok) throw new Error("HTTP "+r.status);
  const j = await r.json();
  const text = (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
  return { sections:parseSections(text), hits };
}

function md2html(md){
  const lines = md.split("\n"); const out = []; let inList = false;
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  let i = 0;
  while(i < lines.length){
    const L = lines[i];
    if(/^\|/.test(L) && i+1<lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      const rows = [L]; let j = i+2;
      while(j<lines.length && /^\|/.test(lines[j])){ rows.push(lines[j]); j++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      out.push("<table><tr>"+cells(rows[0]).map(c=>"<th>"+c+"</th>").join("")+"</tr>");
      for(let k=1;k<rows.length;k++) out.push("<tr>"+cells(rows[k]).map(c=>"<td>"+c+"</td>").join("")+"</tr>");
      out.push("</table>"); i = j; continue;
    }
    if(/^###\s/.test(L)) out.push("<h3>"+inline(L.slice(4))+"</h3>");
    else if(/^##\s/.test(L)) out.push("<h2>"+inline(L.slice(3))+"</h2>");
    else if(/^#\s/.test(L)) out.push("<h2 style='font-size:21px'>"+inline(L.slice(2))+"</h2>");
    else if(/^---+\s*$/.test(L)) out.push("<hr>");
    else if(/^[-*]\s/.test(L)){
      if(!inList){ out.push("<ul>"); inList = true; }
      out.push("<li>"+inline(L.replace(/^[-*]\s/,""))+"</li>");
      if(i+1>=lines.length || !/^[-*]\s/.test(lines[i+1])){ out.push("</ul>"); inList = false; }
    }
    else if(/^\d+\.\s/.test(L)) out.push("<li>"+inline(L.replace(/^\d+\.\s/,""))+"</li>");
    else if(/^>\s?/.test(L)) out.push("<blockquote>"+inline(L.replace(/^>\s?/,""))+"</blockquote>");
    else if(L.trim()!=="") out.push("<p>"+inline(L)+"</p>");
    i++;
  }
  if(inList) out.push("</ul>");
  return out.join("\n");
}
