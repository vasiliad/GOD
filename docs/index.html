<style>
/* =====================================================
   GOD — THE SCROLL OF MIDNIGHT
   Visual language: ancient manuscript meets modern glassmorphism
   Palette: Tabernacle gold (#c9a84c) on midnight indigo
   ===================================================== */

@import url("https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+Hebrew:wght@400;600;700&display=swap");

:root {
  --bg: #080c16;
  --bg2: #0d1322;
  --bg3: #121a2e;
  --card: rgba(18, 26, 46, 0.72);
  --card-solid: #121a2e;
  --card2: rgba(24, 34, 58, 0.8);
  --line: rgba(201, 168, 76, 0.12);
  --line2: rgba(201, 168, 76, 0.25);
  --fg: #e8e4d8;
  --fg2: #d4cfc0;
  --dim: #8a94a8;
  --dim2: #5a6a80;
  --acc: #c9a84c;
  --acc-bright: #e8d4a0;
  --acc-dim: rgba(201, 168, 76, 0.3);
  --acc2: #7aa8cc;
  --bad: #c75450;
  --ok: #6db37c;
  --gold-grad: linear-gradient(135deg, #c9a84c 0%, #e8d4a0 50%, #c9a84c 100%);
  --card-grad: linear-gradient(145deg, rgba(18,26,46,.75) 0%, rgba(14,20,36,.6) 100%);
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.3);
  --glow: 0 0 20px rgba(201, 168, 76, 0.1), 0 0 60px rgba(201, 168, 76, 0.05);
  --font-display: "Playfair Display", "Georgia", serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-hebrew: "Noto Serif Hebrew", "Times New Roman", serif;
  --radius: 14px;
}

* { box-sizing: border-box; }

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  color: var(--fg);
  font: 15px/1.7 var(--font-body);
  background: var(--bg);
  min-height: 100vh;
}

/* ===== BACKGROUND: Midnight scroll ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: -2;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,16,40,.8) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 100%, rgba(10,30,50,.5) 0%, transparent 50%),
    radial-gradient(ellipse 50% 30% at 20% 60%, rgba(20,14,36,.4) 0%, transparent 50%),
    linear-gradient(180deg, #080c16 0%, #0d1322 50%, #12102a 100%);
}

body::after { display:none; }


/* ===== HEADER: The golden inscription ===== */
header {
  padding: 40px 24px 16px;
  max-width: 1160px;
  margin: 0 auto;
  position: relative;
  text-align: center;
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  letter-spacing: -0.5px;
  color: var(--fg);
  line-height: 1.2;
}

h1 b {
  color: var(--acc);
  font-weight: 800;
}

h1 b::after {
  content: '';
  display: block;
  width: 120px;
  height: 2px;
  margin: 4px auto 0;
  background: var(--gold-grad);
  border-radius: 1px;
  opacity: 0.6;
}

.sub {
  color: var(--dim);
  margin-top: 12px;
  font-size: 14.5px;
  font-weight: 300;
  line-height: 1.7;
  max-width: 720px;
}

/* Language selector */
.langs {
  display: flex;
  gap: 4px;
  margin-top: 14px;
  justify-content: center;
}

.langs button {
  background: transparent;
  border: 1px solid rgba(201, 168, 76, 0.2);
  color: var(--dim);
  padding: 4px 16px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 12.5px;
  font-weight: 500;
  transition: all 0.25s ease;
}

.langs button:hover {
  border-color: var(--acc);
  color: var(--fg);
}

.langs button.on {
  background: rgba(201, 168, 76, 0.12);
  border-color: var(--acc);
  color: var(--acc-bright);
  font-weight: 600;
}

/* ===== NAV: The golden tabernacle entrance ===== */
nav {
  display: flex;
  gap: 6px;
  max-width: 1160px;
  margin: 20px auto 0;
  padding: 0 24px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  padding-bottom: 12px;
}

nav button {
  background: transparent;
  border: 1px solid transparent;
  color: var(--dim);
  padding: 8px 18px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: var(--font-body);
  transition: all 0.3s ease;
  position: relative;
}

nav button::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 50%;
  width: 0;
  height: 2px;
  background: var(--gold-grad);
  border-radius: 1px;
  transition: all 0.3s ease;
  transform: translateX(-50%);
}

nav button:hover {
  color: var(--fg);
}

nav button:hover::after {
  width: 60%;
}

nav button.on {
  color: var(--acc-bright);
  font-weight: 600;
}

nav button.on::after {
  width: 80%;
  opacity: 1;
}

/* ===== MAIN: The sacred text ===== */
main {
  max-width: 1160px;
  margin: 0 auto;
  padding: 24px 24px 80px;
  animation: fadeIn 0.4s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

h2 {
  font-family: var(--font-display);
  font-size: 22px;
  margin: 28px 0 14px;
  font-weight: 600;
  color: var(--fg);
  letter-spacing: -0.3px;
}

h2::after {
  content: '';
  display: block;
  width: 40px;
  height: 2px;
  margin: 6px auto 0;
  background: var(--gold-grad);
  border-radius: 1px;
  opacity: 0.5;
}

h3 {
  font-size: 15px;
  margin: 16px 0 8px;
  color: var(--acc);
  font-weight: 600;
  font-family: var(--font-body);
}

p { margin: 8px 0; }

/* ===== TABLE: The ledger of destinies ===== */
table {
  width: 100%;
  border-collapse: collapse;
  background: var(--card);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  font-size: 13.5px;
  box-shadow: var(--shadow);
}

th, td {
  padding: 10px 14px;
  text-align: left;
  border-bottom: 1px solid rgba(201, 168, 76, 0.06);
}

th {
  color: var(--acc);
  font-weight: 600;
  background: rgba(201, 168, 76, 0.06);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

tr:hover td {
  background: rgba(201, 168, 76, 0.04);
}

tr:last-child td { border-bottom: none; }

/* ===== CARDS: Glassmorphism scrolls ===== */
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}

.card {
  background: var(--card-grad);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 20px;
  transition: all 0.3s ease;
  position: relative;
  overflow: hidden;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--gold-grad);
  opacity: 0.25;
  border-radius: var(--radius) var(--radius) 0 0;
}

.card:hover {
  border-color: var(--line2);
  transform: translateY(-2px);
  box-shadow: var(--shadow), var(--glow);
}

.card .v {
  font-family: var(--font-display);
  font-size: 32px;
  font-weight: 800;
  color: var(--acc);
  line-height: 1;
  text-align: center;
}

.card .l {
  color: var(--dim);
  font-size: 12.5px;
  margin-top: 6px;
  font-weight: 500;
  text-align: center;
}

.card .b {
  font-size: 12px;
  color: var(--fg2);
  margin-top: 4px;
  opacity: 0.8;
}

/* ===== BAR: The scales of destiny ===== */
.bar {
  display: flex;
  height: 8px;
  border-radius: 4px;
  overflow: hidden;
  margin: 10px 0 6px;
  background: rgba(0, 0, 0, 0.3);
}

.bar i { display: block; height: 100%; }

.leg {
  font-size: 11.5px;
  color: var(--dim);
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
}

.leg i {
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-right: 4px;
}

/* ===== NOTE: The whispered word ===== */
.note {
  color: var(--dim);
  font-size: 12.5px;
  margin: 10px 0;
  line-height: 1.6;
}

/* Оговорка о статусе симуляции — должна быть видна, а не спрятана в подвал */
.disclaim {
  border-left: 3px solid var(--acc);
  background: rgba(201, 168, 76, 0.07);
  color: var(--fg2);
  font-size: 13px;
  line-height: 1.6;
  padding: 10px 14px;
  margin: 12px 0;
  border-radius: 0 6px 6px 0;
}
[dir="rtl"] .disclaim {
  border-left: none;
  border-right: 3px solid var(--acc);
  border-radius: 6px 0 0 6px;
}

.note.waiting {
  color: var(--acc);
  animation: pulse 2s ease-in-out infinite;
  font-weight: 500;
}

@keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

/* ===== FILTERS ===== */
.filters {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin: 12px 0 16px;
}

input, select {
  background: rgba(0, 0, 0, 0.25);
  border: 1px solid var(--line);
  color: var(--fg);
  padding: 10px 16px;
  border-radius: 10px;
  font-size: 14px;
  font-family: var(--font-body);
  transition: all 0.3s ease;
}

input { flex: 1; min-width: 160px; }

input:focus, select:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
  outline: none;
}

input::placeholder { color: var(--dim2); }

/* ===== HEBREW: The sacred script ===== */
.he {
  font-family: var(--font-hebrew);
  font-size: 20px;
  line-height: 2;
  direction: rtl;
  text-align: right;
  color: #f0e8d8;
  padding: 12px 0;
}

.he.small { font-size: 16.5px; color: #d0c8b8; }

/* ===== TAGS: Seals of destiny ===== */
.tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
  border: 1px solid var(--line);
  color: var(--dim);
  margin-right: 4px;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.tag.punishment { color: var(--bad); border-color: rgba(199, 84, 80, 0.3); background: rgba(199, 84, 80, 0.06); }
.tag.blessing, .tag.rescue, .tag.answer_granted { color: var(--ok); border-color: rgba(109, 179, 124, 0.3); background: rgba(109, 179, 124, 0.06); }
.tag.silence { color: var(--dim); border-style: dashed; }

/* ===== EPISODES: The chronicles ===== */
.ep {
  background: var(--card);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 16px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
}

.ep:hover {
  border-color: var(--line2);
  transform: translateX(4px);
  box-shadow: var(--glow);
}

.ep .s { color: var(--acc2); font-size: 12.5px; font-weight: 500; }

/* ===== DETAIL: The unveiled mystery ===== */
.detail {
  background: var(--card-grad);
  backdrop-filter: blur(16px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 24px;
  margin-top: 16px;
  box-shadow: var(--shadow);
  animation: fadeIn 0.3s ease;
}

.sect { margin-top: 16px; }

.sect .h {
  font-size: 10.5px;
  color: var(--acc);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 6px;
  font-weight: 600;
  opacity: 0.7;
}

.src {
  color: var(--acc2);
  font-size: 13px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

/* ===== MESSAGE: The human utterance ===== */
.msg-user {
  background: rgba(201, 168, 76, 0.06);
  border: 1px solid rgba(201, 168, 76, 0.15);
  border-radius: 12px;
  padding: 12px 16px;
  margin: 12px 0;
}

.msg-user .s {
  color: var(--acc);
  font-size: 12px;
  font-weight: 600;
  margin-bottom: 4px;
}

/* ===== ACTION: The divine deed ===== */
div[style*="border-left:3px solid var(--acc)"] {
  border-left: 3px solid var(--acc) !important;
  background: rgba(201, 168, 76, 0.05);
  padding: 12px 14px !important;
  border-radius: 0 10px 10px 0;
  margin: 12px 0 !important;
}

/* ===== BRAIN STATE: The divine pulse ===== */
.modes {
  display: flex;
  gap: 8px;
  align-items: center;
  margin: 14px 0;
  padding: 10px 14px;
  background: var(--card);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 12px;
}

#brainDot { font-size: 16px; }

#brainState { font-weight: 500; }

/* ===== OTHER ===== */
ul, ol { margin: 8px 0; padding-left: 22px; }
li { margin: 6px 0; }

code {
  background: rgba(201, 168, 76, 0.08);
  padding: 2px 8px;
  border-radius: 6px;
  font-size: 12.5px;
  color: var(--acc-bright);
  font-family: 'Cascadia Code', 'Consolas', monospace;
}

blockquote {
  border-left: 3px solid var(--acc);
  margin: 12px 0;
  padding: 8px 16px;
  color: var(--dim);
  background: rgba(201, 168, 76, 0.04);
  border-radius: 0 8px 8px 0;
}

hr {
  border: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line2), transparent);
  margin: 24px 0;
}

a { color: var(--acc2); transition: color 0.2s; }
a:hover { color: var(--acc-bright); }

/* ===== SCROLLBAR ===== */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: rgba(201, 168, 76, 0.2); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: rgba(201, 168, 76, 0.35); }

/* ===== MOBILE ===== */
/* ===== ЧТЕНИЕ ТАНАХА: полный текст, речь Бога подсвечена ===== */
.chapter { font-size: 20px; line-height: 2.15; text-align: right; direction: rtl; max-width: 780px; margin: 0 auto; }
.verse { padding: 3px 10px; border-radius: 8px; }
.verse.god { background: rgba(201, 168, 76, 0.09); box-shadow: inset -3px 0 0 var(--acc); cursor: pointer; }
.verse.god:hover { background: rgba(201, 168, 76, 0.17); }
.vn { color: var(--dim); font-size: 12px; margin-left: 8px; user-select: none; }
.raudio { text-align: center; margin: 10px 0 6px; }
.raudio .note { font-size: 12px; color: var(--dim); }
.readnote { text-align: center; }

/* встроенный плеер чтения — в стиле сайта */
.player { display: flex; align-items: center; gap: 10px; max-width: 780px; margin: 0 auto 8px;
  padding: 10px 14px; background: var(--card); border: 1px solid var(--line2); border-radius: 12px; }
.pplay { width: 42px; height: 42px; min-width: 42px; border-radius: 50%; border: none; cursor: pointer;
  background: var(--gold-grad); color: #0d1322; font-size: 15px; display: flex; align-items: center; justify-content: center; }
.pplay:hover { filter: brightness(1.12); }
.pstop { width: 34px; height: 34px; min-width: 34px; border-radius: 50%; cursor: pointer;
  background: none; border: 1px solid var(--line2); color: var(--fg2); font-size: 12px;
  display: flex; align-items: center; justify-content: center; }
.pstop:hover { color: var(--acc); border-color: var(--acc); }
.pbar { flex: 1; height: 6px; background: rgba(255, 255, 255, 0.09); border-radius: 3px; cursor: pointer; }
.pfill { height: 100%; width: 0%; background: var(--gold-grad); border-radius: 3px; }
.ptime { font-size: 12px; color: var(--dim); min-width: 86px; text-align: center; font-variant-numeric: tabular-nums; }
.pver { font-size: 12px; color: var(--acc); min-width: 70px; text-align: right; }
.pbtn { background: none; border: 1px solid var(--line2); color: var(--acc); border-radius: 50%;
  width: 20px; height: 20px; line-height: 1; cursor: pointer; font-size: 9px; padding: 0; margin-left: 6px; vertical-align: middle; }
.pbtn:hover { background: rgba(201, 168, 76, 0.2); }
.pch { border-radius: 14px; width: auto; padding: 3px 14px; font-size: 12px; margin: 0 8px 0 0; }
.verse.playing, .verse.god.playing { background: rgba(201, 168, 76, 0.22); }
.spd.on { background: rgba(201, 168, 76, 0.25); color: var(--fg); }
.verse .vtr { display: none; }
.chapter.trall .vtr { display: block; }
.verse.tr-open .vtr { display: block; }
.vtr { direction: ltr; text-align: right; font-size: 13px; color: var(--fg2); line-height: 1.5; margin-top: 2px; }

/* дропдауны чтения — в тему сайта вместо белых нативных */
.ddwrap { position: relative; }
.dd { background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); color: var(--fg); padding: 9px 14px;
  border-radius: 10px; cursor: pointer; font: inherit; text-align: left; }
.dd:hover { border-color: var(--line2); }
.dd .ddc { color: var(--dim); margin-left: 8px; font-size: 11px; }
.ddch { min-width: 74px; text-align: center; }
.ddp { display: none; position: absolute; top: calc(100% + 6px); left: 0; z-index: 60; min-width: 300px; max-height: 430px;
  overflow-y: auto; background: var(--card-solid); border: 1px solid var(--line2); border-radius: 12px;
  box-shadow: 0 14px 40px rgba(0, 0, 0, 0.55); padding: 6px; }
.ddp.open { display: block; }
[dir="rtl"] .ddp { left: auto; right: 0; }
.ddp.ddgrid { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 4px; min-width: 264px; }
.ddp.ddgrid.open { display: grid; }
.ddh { color: var(--acc); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; padding: 9px 10px 4px; }
.ddi { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 7px 10px;
  border-radius: 8px; cursor: pointer; color: var(--fg); }
.ddi:hover { background: rgba(201, 168, 76, 0.12); color: var(--acc); }
.ddi.on { color: var(--acc); }
.ddi.on::before { content: "●"; font-size: 8px; margin-right: 7px; }
.ddgrid .ddi { justify-content: center; padding: 6px 0; }
.ddi .ddn { color: var(--dim); font-size: 12px; }

@media (max-width: 640px) {
  header { padding: 28px 16px 12px; }
  h1 { font-size: 24px; }
  nav { padding: 0 16px; }
  main { padding: 16px 16px 60px; }
  .he { font-size: 17px; }
  .card .v { font-size: 26px; }
  th, td { padding: 8px 10px; }
  .ddp { max-width: calc(100vw - 40px); }
  .dd { max-width: 58vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .verse .pbtn { width: 24px; height: 24px; font-size: 10px; }
  .chapter { font-size: 18px; }
  .vtr { font-size: 12px; }
  .raudio .note { display: block; margin-top: 4px; }
  .pver { display: none; }
  .player { padding: 8px 10px; }
}

/* ===== ПОГРУЖЕНИЕ: клик по числу/тегу статистики — дверь в эпизоды ===== */
html { scroll-behavior: smooth; }
.cl { cursor: pointer; }
.cl:hover { color: var(--acc); text-decoration: underline; }
.dive { cursor: pointer; }
.dive:hover { outline: 1px solid var(--line2); border-radius: 10px; }
tr.dive:hover td { background: rgba(201, 168, 76, 0.06); }
.tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.toc a { color: var(--fg2); }
.toc a:hover { color: var(--acc); }
.totop { display: block; margin: 16px auto; background: var(--card); border: 1px solid var(--line2);
  color: var(--fg2); border-radius: 10px; padding: 8px 22px; cursor: pointer; font: inherit; }
.totop:hover { color: var(--acc); }

</style>
</head>

<svg id="bg-scene" style="position:fixed;top:0;left:0;width:100%;height:100vh;z-index:-2;pointer-events:none" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
<defs>
<radialGradient id="glow1" cx="50%" cy="50%" r="50%">
<stop offset="0%" style="stop-color:#c9a84c;stop-opacity:0.06"/>
<stop offset="100%" style="stop-color:#c9a84c;stop-opacity:0"/>

const APPVER = "2026-10-26e";
if (typeof location !== "undefined") {
  const appverCheck = () => fetch(location.pathname, { cache: "no-store" }).then(r => r.text()).then(t => {
    const v = (t.match(/const APPVER = "([^"]+)"/) || [])[1];
    if (v && v !== APPVER && !sessionStorage.getItem("appver")) {
      sessionStorage.setItem("appver", "1");
      location.reload();
    }
  }).catch(() => {});
  appverCheck();
  setInterval(appverCheck, 60000);   // открытая вкладка обновляется сама в течение минуты
}
/* =====================================================================
   GOD — единый файл страницы. Разделы: данные, вкладки, чат, роутер.
   ===================================================================== */

/* ---------- утилиты ---------- */
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const OUT = { punishment:"#e07a6a", revelation:"#e0b050", blessing:"#7fce9a", covenant:"#7fb2e5",
  rescue:"#8fd4c8", answer_granted:"#a8d08d", compliance:"#c9b1e0", silence:"#6b7280",
  unclear:"#565e6e", delayed:"#b58e5f", refusal:"#c25a8e" };
const bar = (obj, limit, dive) => {
  const lim = limit || 99;
  const items = Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,lim);
  const tot = items.reduce((s,x)=>s+x[1],0) || 1;
  return `<div class="bar">${items.map(([k,v])=>`<i style="width:${(v/tot*100).toFixed(1)}%;background:${OUT[k]||"#888"}"></i>`).join("")}</div>` +
  `<div class="leg">${items.map(([k,v])=>{
    const lbl = `<i style="background:${OUT[k]||"#888"}"></i>${dn("out",k)} ${(v/tot*100).toFixed(0)}%`;
    return dive ? `<span class="cl" onclick='event.stopPropagation();dive(${JSON.stringify(Object.assign({},dive,{out:k}))})'>${lbl}</span>`
                : `<span>${lbl}</span>`;
  }).join("")}</div>`;
};
const store = {
  get(k,d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};

  about_p5:"<b>How the simulation works.</b> An answer is built in three steps. First the page finds the nearest episodes in the corpus — hybrid search (lexical + e5-small vectors) over 2,050 episodes, right in the browser. Then the model (DictaLM 3.0, 12B) picks a single episode in a short, separate request: the one whose speech of God best answers the question. Next the model receives only that episode and must compose its reply verbatim from its words: Hebrew, vocalization, translations and a verse citation. Finally every answer is checked against the registry: an unconfirmed reply is never shown — you see a verified verse from the corpus instead. While the brain is asleep (the Kaggle notebook sleeps after ~12 h of work), the simulation honestly says it is unavailable, and the whole corpus stays open.",

async function nikudFor(book, refs){
  const idx = await nikudIndex();
  const bk = book.charAt(0).toUpperCase() + book.slice(1);  // nikud.json хранит имена с заглавной ("Genesis|…"), а в book_order книга "genesis" — регистр нормализуем
  const out = [];
  for(const r of (refs||[]).slice(0,3)){
    const m = r.match(/^(\d+):(\d+)$/);
    if(!m) continue;
    const t = idx[bk+"|"+m[1]+"|"+m[2]];
    if(t) out.push(t);
  }
  return out.join("  ");
}

}

const EN_BRIDGE = { fear:"страх", afraid:"страх", scared:"страх", anger:"гнев", wrath:"гнев",
  destroy:"разруш", destroyed:"разруш", punish:"наказа", punishment:"наказание", mercy:"милость",
  forgive:"простил", forgiveness:"прощение", silence:"молчание", pray:"молитва", prayer:"молитва",

  covenant:"завет", temple:"храм", idol:"идол", dream:"сон", die:"умер", death:"смерть",
  died:"умер", why:"почему", listen:"слыш", hear:"слыш", answer:"отвеча", command:"повел",
  law:"закон", torah:"тор", help:"спас", enemies:"враг" };
/* мост для ивритских вопросов: корпус аннотирован по-русски, поэтому ивритские слова
   переводим в русские ключевые — иначе лексика вопроса не нашла бы эпизоды */
const HE_BRIDGE = { מה:"что", מי:"кто", ספר:"скажи", תן:"дай", דרך:"путь", דרכך:"путь",
  לאדם:"человек", אדם:"человек", איך:"как", לדעת:"знать", לעשות:"делать", לחיות:"חיה",
  חיים:"жизнь", תפילה:"молитва", תפילתי:"молитва", בכי:"плач", עצב:"скорб", אשמה:"вина",
  שמחה:"радость", לב:"сердце", ירושלים:"Иерусалим", מצרים:"Египет", אברהם:"Авраам",
  בני:"сын", בת:"дочь", עם:"народ" };
function queryTokens(q){
  const m = q.toLowerCase();
  const toks = new Set();
  for(const t of (m.match(/[а-яё-]{4,}/g) || [])) if(!RU_STOP.has(t)) toks.add(t);
  for(const w of (m.match(/[a-z]{2,}/g) || [])) if(EN_BRIDGE[w]) toks.add(EN_BRIDGE[w]);
  for(const w of (m.match(/[\u05D0-\u05EA]{3,}/g) || [])){ toks.add(w); if(HE_BRIDGE[w]) toks.add(HE_BRIDGE[w]); }
  /* маркеры убираем из итогового набора (мост EN/HE тоже мог их дать) */
  for(const w of RU_MARKERS) toks.delete(w);
  const syn = new Set(toks);
  for(const t of toks) for(const g of RU_SYN)
    if(g.some(x => t===x || (x.length>=4 && (t.includes(x)||x.includes(t))))) g.forEach(x=>syn.add(x));
  return syn;
}
function isProper(w){ return /^[A-ZА-Я]/.test(w) && w.length>=4; }
/* ---------- векторный retrieval: те же веса e5-small, что считали индекс ---------- */
let VECM = null;   // null = не пытались; false = недоступен (CDN/ошибка) — тогда чистая лексика
let EMBD = null;   // embeddings.json + деквантованные строки + карта ключей
async function vectorReady(){
  if(VECM !== null) return VECM;
  try{
    const { pipeline } = await import("https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2");
    VECM = await pipeline("feature-extraction", "Xenova/multilingual-e5-small", { quantized: true });
  }catch(e){ VECM = false; }
  return VECM;
}
function dequant(row){
  const bin = atob(row.q), n = bin.length, out = new Float32Array(n);
  for(let i=0;i<n;i++) out[i] = (bin.charCodeAt(i) << 24 >> 24) * row.s / 127;  // int8 → float
  return out;
}
const cosv = (a,b) => { let d=0; for(let i=0;i<a.length;i++) d += a[i]*b[i]; return d; };
async function embIndex(){
  if(EMBD !== null) return EMBD;
  try{
    const j = await jget("data/embeddings.json");
    const map = {}; for(let i=0;i<j.meta.length;i++) map[j.meta[i].b+"|"+j.meta[i].s1] = i;
    EMBD = { j, map, vecs: new Array(j.rows.length) };
  }catch(e){ EMBD = false; }
  return EMBD;
}
const QCACHE = {};
async function embedQuery(q){
  const m = await vectorReady();
  if(!m) return null;
  if(!QCACHE[q]) QCACHE[q] = Array.from((await m("query: "+q, { pooling:"mean", normalize:true })).data);
  return QCACHE[q];
}
async function retrieve(q, k){
  const lim = k || 6;
  const toks = queryTokens(q);
  const props = q.split(/[^A-Za-zА-Яа-яёЁ\u05D0-\u05EA]+/).filter(isProper);
  const trig = classify(q);            // тип обращения выбирает эпизоды с тем же триггером:
  const cls = trigClass(trig);         // класс реестра (у «confession»/«covenant» он другой):
  const form = requestForm(q);         // форма ответа, которую просит человек (утешить/простить/…)
  const scored = [];                    // «я боюсь» (distress) → эпизоды, где Бог ОТВЕЧАЕТ на беду
  const VEC_W = 1.0;                   // вес вектора в СПАСАТЕЛЬНОМ режиме (лексика молчит)
  let lexHit = false;                  // нашлось ли хоть одно слово/имя в описаниях эпизодов
  await everyBook(async b => {
    const eps = await bookDocs(b);
    for(const e of eps){
      const txt = (e.summary_ru+" "+e.god_action).toLowerCase();
      let s = 0;
      /* вес слова: 6+ букв — 10/log, 4–5 букв — 6/log (короткое, но различимое:
         «научи», «пути», «имя»), 3 и меньше — 1/log. Раньше короткое слово весило
         1/log ≈ 0,1 и тонуло в бусте класса (+4) и векторе — нужные эпизоды
         уходили в хвост (замер: «я боюсь умереть» → genesis 15:1 был на #733). */
      for(const t of toks) if(txt.includes(t)){
        s += t.length>=6 ? 10/Math.log(4+txt.length) : t.length>=4 ? 6/Math.log(3+txt.length) : 1/Math.log(3+txt.length);
        lexHit = true;
      }
      for(const p of props) if(p.length>=5 && txt.includes(p.toLowerCase())){ s += 6/Math.log(4+txt.length); lexHit = true; }
      if(e.god_speech_plain) s += 2.5;        // Бог говорил в эпизоде — материал для рекомбинации
      if(cls && e.trigger === cls) s += 4;   // тот же класс обращения — главный буст голоса
      if(form){
        const fo = FORM_OUTCOMES[form];
        if(fo.good.indexOf(e.outcome) >= 0) s += 2;     // форма ответа совпала с просьбой
        if(fo.bad.indexOf(e.outcome) >= 0) s -= 1.5;
        /* приговор не утешает: таких эпизодов три из 2050, и на просьбе об утешении
           или защите их быть не должно («ты умрёшь» — не утешение) */
        if((form==="утешение" || form==="защита") &&
           DEATH_VERDICT.some(w => (e.god_speech_plain||"").indexOf(w) >= 0)) s -= 8;
      }
      scored.push([s,b,e]);
    }
  });
  /* ВЕКТОР — ТОЛЬКО КАК СПАСАТЕЛЬНЫЙ СИГНАЛ: когда лексика не нашла ни одного слова.
     Замер на золотом эталоне (14 вопросов): при весах 0; 0,05; 0,1; 0,25; 0,5; 1,0
     меню содержало эталон 13/14 — прироста не даёт ни один вес, но переставляет меню
     (одинаковых меню у весов 0 и 0,25 — 1 из 14). Хуже: браузер считает вектор
     int8-WASM, зеркало — int8-CPU, и для длинных запросов косинус векторов падает до
     0,9987 — страница и зеркало давали разное меню, то есть замер описывал не страницу.
     Теперь обычный вопрос — чистая лексика: детерминированно, быстро, без загрузки
     модели. Вектор подключается лишь там, где лексика молчит (перефразировка без
     общего слова), и тогда он — единственный тематический сигнал, вес полный. */
  if(!lexHit){
    const idx = await embIndex();
    const qv = idx ? await embedQuery(q) : null;
    if(qv && idx){
      const cosRows = [];
      for(const entry of scored){
        const ri = idx.map[entry[1]+"|"+entry[2].span.start];
        if(ri !== undefined){
          if(!idx.vecs[ri]) idx.vecs[ri] = dequant(idx.j.rows[ri]);
          cosRows.push([entry, cosv(qv, idx.vecs[ri])]);
        }
      }
      // z-нормировка косинусов: сырые cos e5 слипаются в полосу (~0.8) и не различают,
      // z = (cos-среднее)/std ранжирует относительно — полоса уходит
      if(cosRows.length > 20){
        const mean = cosRows.reduce((acc,x)=>acc+x[1],0)/cosRows.length;
        const std = Math.sqrt(cosRows.reduce((acc,x)=>acc+(x[1]-mean)*(x[1]-mean),0)/cosRows.length) || 1e-9;
        for(const [entry, cos] of cosRows){
          entry[0] += VEC_W * (cos-mean)/std;
          entry[3] = cos;                    // для отладки: сырой косинус в хвосте
        }
      }
    }
  }
  /* при равных очках — книга и стих: иначе порядок зависит от того, как обошли корпус,
     и страница с зеркалом дают разное меню (а с ним — разный ответ) */
  /* очки округляем до 1e-6: векторы на странице float32, в зеркале double, и разница
     в последних битах переставляла двух кандидатов с равными очками. Книгу сравниваем
     без локали: localeCompare зависел от локали браузера и ставил «genesis» иначе,
     чем зеркало. */
  const r6 = v => Math.round(v*1e6)/1e6;
  const cmpBook = (a,b) => { const A=a.toLowerCase(), B=b.toLowerCase();
                             return A<B ? -1 : A>B ? 1 : (a<b ? -1 : a>b ? 1 : 0); };
  const cmpVerse = (a,b) => { const pa=String(a).split(":"), pb=String(b).split(":");
                               const ca=parseInt(pa[0],10)||0, cb=parseInt(pb[0],10)||0;
                               const va=parseInt(pa[1],10)||0, vb=parseInt(pb[1],10)||0;
                               return (ca-cb) || (va-vb) || (a<b ? -1 : a>b ? 1 : 0); };
  /* При равных очках — книга по алфавиту (без локали), затем стих числами.
     Замер на золотом эталоне (14 вопросов): алфавитный порядок дал меню 14/14,
     канонический (устойчивая сортировка по обходу корпуса: Тора → Невиим →
     Кетувим) — 13/14. Канонический порядок ставил «II_Chronicles» и «I_Samuel»
     выше «Exodus» и «genesis», и при равных очках (класс обращения + форма +
     речь) решал, кто попадёт в меню. */
  scored.sort((x,y)=> (r6(y[0])-r6(x[0])) || cmpBook(x[1],y[1]) ||
                     cmpVerse(x[2].span.start, y[2].span.start));
  return scored.slice(0,lim);
}
/* диалоговая память */
const MEM = { offenses:0, grace:0, turns:0 };
function memUpdate(q){
  const m = q.toLowerCase();
  if(/не буду|наруш|не послуш|отвергаю|идол|другого бога|мне всё равно|плевать|i will not|i won't/.test(m)) MEM.offenses++;
  if(/согрешил|раскаиваюсь|прости меня|покаян|forgive me|i repent/.test(m)){
    MEM.offenses = Math.max(0, MEM.offenses-1); MEM.grace++;
  }
  MEM.turns++;
}

/* =====================================================================
   ЧАТ — живой режим (LLM-мозг проекта на Kaggle; ключи только в браузере)
   ===================================================================== */
const BRAIN_STATUS_URL = "https://huggingface.co/datasets/arabyan/god-brain-status/resolve/main/brain.json";
const BRAIN = { info:{state:"off"} };
/* свой адрес мозга (localStorage god_cfg): страница тогда говорит по нему, а не по Kaggle —
   значит, и статус должен показывать «свой мозг», а не «мозг спит» (правда важнее фонаря). */
function localBrainCfg(){ return store.get("god_cfg", { endpoint:"", model:"", key:"" }) || {}; }
/* адрес для запроса: свой endpoint можно задать и базой (http://127.0.0.1:18099), и полным
   путём (/v1/chat/completions) — как в скриптах (--url). Без этого страница била в корень
   сервера и получала 404, хотя мозг был жив. */
function brainEndpoint(cfg, info){
  const base = (cfg && cfg.endpoint) || (info && info.url) || "";
  if(!base) return "";
  const b = base.replace(/\/+$/,"");
  return /\/v1\/chat\/completions$/.test(b) ? b : b + "/v1/chat/completions";
}
async function brainRefresh(){
  let kaggle = null, netError = null;
  try{
    const r = await fetch(BRAIN_STATUS_URL, {cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    kaggle = await r.json();
  }catch(e){ kaggle = null; netError = (e && e.message) || String(e); }
  const kOk = !!(kaggle && kaggle.ok && kaggle.url && (Date.now()/1000 - (kaggle.ts||0)) < 3600);
  let state = "off";
  if(kOk) state = "on";               // общий мозг (DictaLM на Kaggle) свеж — доступен каждому посетителю
  else if(kaggle && !kaggle.ok && kaggle.phase === "starting" && (Date.now()/1000 - (kaggle.ts||0)) < 1800) state = "starting";
  const local = !!(localBrainCfg().endpoint);
  if(local) state = "local";          // свой сервер: состояние Kaggle не имеет значения
  BRAIN.info = { state, kaggleOk:kOk, checked:Date.now(), url:(kaggle&&kaggle.url)||"", key:(kaggle&&kaggle.key)||"", model:(kaggle&&kaggle.model||""),
                 phase:(kaggle&&kaggle.phase)||"", error:(kaggle&&kaggle.error)||null, netError:netError, local:local };
  const el = document.getElementById("brainDot");
  if(el){
    el.textContent = (state==="on" || state==="local") ? "🟢" : state==="starting" ? "🟡" : "🔴";
    el.title = state==="local" ? t("b_local_tip")
      : state==="on" ? t("b_on_tip")
      : state==="starting" ? t("b_starting_tip")
      : t("b_off_tip") + (BRAIN.info.error ? " (ошибка / error: " + BRAIN.info.error + ")" : "")
                        + (netError ? " (" + netError + ")" : "");
  }
  const st = document.getElementById("brainState");
  if(st) st.textContent = state==="local" ? t("b_local")
              : state==="on" ? t("b_on") : state==="starting" ? t("b_starting") : t("b_off");
  paintBrainNote();
  if(window.brainSyncInput) window.brainSyncInput();
  return BRAIN.info;
}
/* Заметка чата зависит от состояния мозга: проверяем / спит / поднимается / на связи.
   Живёт отдельной функцией, потому что её обновляет и brainRefresh, и смена языка.
   До первого ответа brain.json показываем «проверяем», а не «спит» — иначе живой мозг
   первые секунды страницы объявляется спящим. */
function paintBrainNote(){
  const el = document.getElementById("chatNote");
  if(!el) return;
  const info = BRAIN.info || {};
  const state = !info.checked ? "check" : (info.state || "off");
  // netError: статус не дошёл (сеть посетителя) — это не «мозг спит», а «проверить не удалось»
  const key = !info.checked ? "chat_note_check"
            : state==="local" ? "chat_note_local"
            : info.netError ? "chat_note_checkfail"
            : state==="on" ? "chat_note_on"
            : state==="starting" ? "chat_note_starting" : "chat_note_off";
  el.textContent = t(key);
  el.style.color = (state==="on" || state==="local" || state==="starting") ? "var(--acc)"
                  : (key==="chat_note_check" || key==="chat_note_checkfail") ? "var(--dim)" : "var(--bad)";
  el.style.fontWeight = "500";
}
/* ─────────────────────────────────────────────────────────────────────────────
   СХЕМА ОТВЕТА — два шага, измерено на локальном мозге (DictaLM 3.0 12B Q5_K_M):
     ШАГ 1 (выбор):   маленький закрытый вызов — «выбери один эпизод», ответ = номер.

   ответов: модель цитировала Танах по памяти. Новая — 7/8, покрытие 41% → 88%.
   Промпты живут здесь, страница — единственный источник (скрипты берут их отсюда).

const SYS_SELECT = "Ты — помощник исследователя Танаха. Твоя единственная задача — выбрать ОДИН эпизод\n" +

/* Блок [ACTION] — «образ Бога» как распределение по классу обращения: форма
   реакции (слова/действие) и вероятности исходов из профиля реестра.
   Уходит в шаг ВЫБОРА, а не в цитату: он задаёт, какую форму отклика искать
   в эпизодах, и не позволяет подмешать в реплику слова вне эпизода. */
function actionBlock(cls, prof){
  const bt = prof && prof.by_trigger && prof.by_trigger[cls];
  const rm = prof && prof.response_modes && prof.response_modes[cls];
  if(!bt || !rm) return "";
  const outs = Object.entries(bt.outcome_p).sort((a,b)=>b[1]-a[1]).slice(0,4)
    .map(([k,v])=> (DATA_NAMES.out.ru[k]||k)+" "+Math.round(v*100)+"%").join(", ");
  const dist = Object.entries(rm.distribution).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=> (DATA_NAMES.mode.ru[k]||k)+" "+Math.round(v*100)+"%").join(", ");
  return "[ACTION] класс обращения: " + (DATA_NAMES.trig.ru[cls]||cls) + " (" + bt.n + " эпизодов в реестре)\n" +
         "форма реакции по реестру: " + dist + "\n" +
         "исходы по реестру: " + outs;

function episodeBlock(c){
  const lines = ["СТИХ: ["+c.book+" "+c.span.start+"]", "речь Бога: " + c.god_speech_plain];
  if(c.nikud) lines.push("огласовка: " + c.nikud);

function pickIndex(raw, n){
  const m = String(raw||"").match(/S\s*(\d+)|(\d+)/i);
  if(!m) return 1;
  const v = parseInt(m[1]||m[2], 10);
  return (v>=1 && v<=n) ? v : 1;
}
const SECTIONS = ["[HEBREW]","[NIKKUD]","[Russian]","[English]","[Hebrew Modern]","[SOURCES]"];
function parseSections(text){
  const out = {};
  for(const tag of SECTIONS){
    const i = text.indexOf(tag); if(i<0) continue;
    const rest = text.slice(i+tag.length);
    let end = rest.length;
    for(const t2 of SECTIONS){ const j = rest.indexOf(t2); if(j>=0 && j<end) end = j; }
    out[tag] = rest.slice(0,end).trim();
  }
  return out;
}
/* один вызов к мозгу: system + user, потоком (Cloudflare не рвёт долгий ответ — 524) */
async function brainAsk(ep, key, model, system, user, temperature, max_tokens){
  const body = { messages:[
    { role:"system", content:system },
    { role:"user", content:user } ], temperature, max_tokens };
  body.model = model;
  body.stream = true;
  const hdr = { "Content-Type":"application/json" };
  if(key) hdr["Authorization"] = "Bearer "+key;
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), 180000);   // холодный старт модели измеряли до 114 с — 75 с обрывали живые ответы
  let r, text;
  try{
    r = await fetch(ep, { method:"POST", headers:hdr, body:JSON.stringify(body), signal:ac.signal });
    if(!r.ok) throw new Error("HTTP "+r.status);
    text = await readStream(r);          // таймаут покрывает и чтение потока, не только установку соединения
  }catch(e){
    brainRefresh();   // туннель мог смениться — сразу обновляем адрес для следующей попытки
    if(e && e.name === "AbortError") throw new Error("мозг не ответил за 180 с (туннель мог смениться)");
    throw e;
  }finally{ clearTimeout(timer); }
  return text;
}

  const ep = brainEndpoint(cfg, BRAIN.info);

  const model = cfg.model || "god-brain";

  const spoken = ctx.filter(c => (c.god_speech_plain||"").trim().length>0);

    trig, cls, probs };

/* читаем SSE-поток и склеиваем текст ответа; сервер без стрима — обычный JSON */
async function readStream(r){
  if(!r.body || !r.body.getReader) return await readJson(r);
  const rd = r.body.getReader(), dec = new TextDecoder();
  let buf = "", out = "";
  const take = line => {
    line = line.trim();
    if(!line.startsWith("data:")) return;
    const payload = line.slice(5).trim();
    if(payload === "[DONE]") return;
    try{ const j = JSON.parse(payload); out += (j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content) || ""; }catch(e){}
  };
  for(;;){
    const {done, value} = await rd.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    let nl;
    while((nl = buf.indexOf("\n")) >= 0){
      take(buf.slice(0, nl)); buf = buf.slice(nl+1);
    }
  }
  buf += dec.decode();        // хвост без завершающего \n — иначе теряется последний чанк
  if(buf.trim()) take(buf);
  if(!out){ try{ const j = await r.json(); out = (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || ""; }catch(e){} }
  return out;
}
async function readJson(r){
  const j = await r.json();
  return (j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
}

  return { hits, trig, cls, probs };
}

/* защита слоёв: [HEBREW] обязан быть консонантным (снимаем огласовки, маккеф сохраняем);

const stripNikudJs = t => String(t||"").replace(/\u05BE/g,"-").replace(/[\u0591-\u05BD\u05BF-\u05C7]/g,"");
const hasHebrew = t => /[\u05D0-\u05EA]/.test(String(t||""));

/* ---------- сверка ответа с корпусом (правило «S») ----------
   Источник истины — реестр эпизодов (docs/data/books/*.json), а не секция
   [SOURCES] модели: модель часто называет стих, в котором этого текста нет.
   Пороги и нормализация — те же, что в scripts/answer_guard.py; паритет
   проверяется общей фикстурой scripts/guard_cases.json:
     python scripts/answer_guard.py --test   ·   node brain/test_page.js  */
const GATE_CTX = 0.80, GATE_QUOTE = 0.50, GATE_LOOSE = 0.80, GATE_RUN = 3, GATE_RU = 0.60, GATE_NIKUD = 0.60;
const GUARD_MIN_WORD = 2, GUARD_CTX_CHARS = 300;
const GUARD_NIQ = /[\u0591-\u05BD\u05BF-\u05C7]/g;   // огласовка+кантилляция (маккеф 05BE — нет)
/* слова ивритского текста: без огласовки, маккеф/дефис → пробел, длина ≥ 2 */
function hebWords(s){
  s = String(s||"").replace(GUARD_NIQ,"").replace(/\u05BE/g," ").replace(/-/g," ");
  return s.split(/[^\u05D0-\u05EA]+/).filter(w => w.length >= GUARD_MIN_WORD);
}
/* форма слова для сравнения: без ведущего «ו» («וענני» == «ענני») */
const hebNorm = w => (w.length > GUARD_MIN_WORD && w.charAt(0) === "\u05D5") ? w.slice(1) : w;
const hebNormSet = words => new Set(words.map(hebNorm));
function guardCoverage(words, vocab){
  if(!words.length) return 0;
  let n = 0; for(const w of words) if(vocab.has(hebNorm(w))) n++;
  return n / words.length;
}
/* непрерывные совпадения реплики с речью эпизода: длина самого длинного
   участка и число покрытых слов реплики (жадный проход, как в Python) */
function guardRuns(reply, speech){
  const R = reply.map(hebNorm), S = speech.map(hebNorm);
  const pos = new Map();
  for(let j=0;j<S.length;j++){ if(!pos.has(S[j])) pos.set(S[j], []); pos.get(S[j]).push(j); }
  const covered = new Set(); let longest = 0, i = 0;
  while(i < R.length){
    let best = 0;
    for(const j of (pos.get(R[i]) || [])){
      let k = 0;
      while(i+k < R.length && j+k < S.length && R[i+k] === S[j+k]) k++;
      if(k > best) best = k;
    }
    if(best > 0){ for(let q=i;q<i+best;q++) covered.add(q); if(best > longest) longest = best; i += best; }
    else i++;
  }
  return { longest, covered: covered.size };
}
const epWords = entry => (entry.length > 2 && entry[2]) ? entry[2] : hebWords(entry[1].god_speech_plain || "");
/* доля слов реплики из фрагментов, реально переданных модели */
function guardCtxCoverage(reply, fragments){
  const vocab = new Set();
  for(const f of fragments)
    for(const w of hebWords(String(f||"").slice(0, GUARD_CTX_CHARS))) vocab.add(hebNorm(w));
  return guardCoverage(reply, vocab);
}
/* строгая привязка: реплика идёт непрерывным участком речи эпизода.
   Подряд должно идти ≥ GATE_RUN слов (для реплики из 1–2 слов — полное
   совпадение): иначе смесь двух стихов привязывалась к одному из них. */
function guardAttributeQuote(reply, episodes){
  const found = [];
  const minRun = reply.length >= GATE_RUN ? GATE_RUN : reply.length;
  for(const entry of episodes || []){
    const speech = epWords(entry);
    if(!speech.length) continue;
    const r = guardRuns(reply, speech);
    const frac = reply.length ? r.covered / reply.length : 0;
    if(frac >= GATE_QUOTE && r.longest >= minRun)
      found.push({ frac, longest:r.longest, book:entry[0], e:entry[1] });
  }
  found.sort((a,b) => b.frac - a.frac || b.longest - a.longest);
  return found.map(f => [f.book, f.e]);
}
/* мягкая привязка: в речи эпизода есть ≥ 80 % слов реплики */
function guardAttributeLoose(reply, episodes){
  const found = [];
  for(const entry of episodes || []){
    const speech = epWords(entry);
    if(!speech.length) continue;
    const frac = guardCoverage(reply, hebNormSet(speech));
    if(frac >= GATE_LOOSE) found.push({ frac, book:entry[0], e:entry[1] });
  }
  found.sort((a,b) => b.frac - a.frac);
  return found.map(f => [f.book, f.e]);
}
/* полная сверка: verified (реплика из переданных фрагментов) | corpus (настоящая
   цитата реестра, но не из окна контекста) | reject (подтверждения нет) */
function guardVerify(hebrew, fragments, corpus, hits){
  const reply = hebWords(hebrew);
  const cc = guardCtxCoverage(reply, fragments);
  if(cc >= GATE_CTX){
    let src = guardAttributeQuote(reply, corpus);
    if(!src.length) src = guardAttributeLoose(reply, corpus);
    if(!src.length) src = guardAttributeLoose(reply, hits);
    return { mode:"verified", ctx_cov:cc, sources:src };
  }
  const src = guardAttributeQuote(reply, corpus);
  if(src.length) return { mode:"corpus", ctx_cov:cc, sources:src };
  return { mode:"reject", ctx_cov:cc, sources:[] };
}
/* русский слой: слова сверяются со словарём summary_ru эпизодов-контекста */
const GUARD_RU_WORD = /[A-Za-zА-Яа-яЁё]{2,}/g;
const guardRuWords = s => (String(s||"").match(GUARD_RU_WORD) || []).map(w => w.toLowerCase());
function guardRuCoverage(reply, texts){
  const vocab = new Set();
  for(const x of texts || []) for(const w of guardRuWords(x)) vocab.add(w);
  const rw = guardRuWords(reply);
  if(!vocab.size || !rw.length) return 0;
  let n = 0; for(const w of rw) if(vocab.has(w)) n++;
  return n / rw.length;
}

    for(const [b, eps] of Object.entries(allDocs))
      for(const e of eps) out.push([b, e, hebWords(e.god_speech_plain || "")]);
    _GUARD_REG = out; _GUARD_REG_N = n;
  }
  return _GUARD_REG;
}
/* источники ответа кликабельны: «Бытие 3:9» / "Genesis 3:9" → карточка эпизода */
function linkSources(src){
  const names = [];
  for(const L of ["ru","en","he"]) for(const [k,v] of Object.entries(BOOK_NAMES[L])) names.push([v,k]);
  names.sort((a,b)=>b[0].length-a[0].length);
  let out = esc(src);
  for(const [nm,key] of names){
    const re = new RegExp(nm.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*\\d+[:.]\\d+", "g");
    out = out.replace(re, m => {
      const start = m.match(/\d+[:.]\d+/)[0].replace(".", ":");
      return `<span class="cl" onclick='srcDive("${key}","${start}")'>${m}</span>`;
    });
  }
  return out;
}

async function liveHTML(r){
  const s = r.sections || {};
  const hits = r.hits || [];
  const sel = r.sel || null;
  /* окно сверки — ровно то, что реально ушло модели: выбранный эпизод (его речь
     И огласовка). Раньше окном были все 6 найденных эпизодов: модель могла
     «сверяться» не тем текстом, который ей дали, а тем, что нашлось рядом. */
  const hitEps = sel ? [[sel.ctx.book, sel.ctx]] : hits.map(x => [x[1], x[2]]);
  const frags = [];
  for(const x of hitEps){
    frags.push(String(x[1].god_speech_plain || "").slice(0, GUARD_CTX_CHARS));
    frags.push(String(x[1].nikud || (await nikudFor(x[0], x[1].god_speech_refs)) || "").slice(0, GUARD_CTX_CHARS));
  }
  const v = guardVerify(s["[HEBREW]"] || "", frags, guardRegistry(), hitEps);
  /* неподтверждённая реплика не показывается: вместо неё — проверенный прецедент корпуса */
  if(v.mode === "reject") return await corpusHTML({hits: (sel && sel.hit) ? [sel.hit] : hits, trig:r.trig, probs:r.probs}, "he_layer_note");

  const top = hitEps.filter(x => x[1].god_speech_plain)[0] || hitEps[0];
  const src0 = v.sources[0] || null;
  let h = `<div class="detail"><h3>${t("god_h")}</h3>`;
  const badge = v.mode === "verified" ? `<span style="font-size:11px;color:var(--acc);font-weight:500">✓ ${t("guard_ok")}</span>` : "";
  const heShow = stripNikudJs(s["[HEBREW]"] || "");
  h += `<div class="sect"><div class="h">${t("sec_hebrew")} ${badge}</div><div class="he">${esc(heShow)}</div></div>`;

  /* огласовка: слой [NIKKUD] должен соответствовать самой реплике; если нет —
     берём огласовку эпизода-источника из корпуса */
  /* огласовка: слой [NIKKUD] должен проговаривать ту же реплику подряд —
     иначе это огласовка другого куска стиха, и рядом она читается как сбой */
  const nikRaw = s["[NIKKUD]"] || "";
  let nikShow = nikRaw, nikNote = "";
  if(nikRaw){
    const rw = hebWords(heShow), sw = hebWords(nikRaw);
    const r = guardRuns(rw, sw);
    const frac = rw.length ? r.covered / rw.length : 0;
    const minRun = rw.length >= GATE_RUN ? GATE_RUN : rw.length;
    if(frac < GATE_NIKUD || r.longest < minRun){
      nikShow = src0 ? await nikudFor(src0[0], src0[1].god_speech_refs) : "";
      nikNote = t("nikud_note");
    }
  }
  if(nikShow) h += `<div class="sect"><div class="h">${t("sec_nikkud")}</div><div class="he small">${esc(nikShow)}</div></div>`;
  if(nikNote) h += `<div class="note">${nikNote}</div>`;

  /* русский слой: слова сверяются с аннотациями эпизодов-контекста */
  const ruRaw = s["[Russian]"] || "";
  if(ruRaw){
    const ruTexts = hitEps.map(x => x[1].summary_ru || "");
    const ruOk = !hasHebrew(ruRaw) && guardRuCoverage(ruRaw, ruTexts) >= GATE_RU;
    if(ruOk) h += `<div class="sect"><div class="h">${t("sec_ru_live")}</div>${esc(ruRaw)}</div>`;
    else {
      const ann = src0 ? src0[1] : (top ? top[1] : null);
      h += `<div class="sect"><div class="h">${t("sec_ru_live")}</div>${esc(ann ? ann.summary_ru : "")}` +
           `<div class="note">${t("ru_layer_note")}</div></div>`;
    }
  }
  const enRaw = s["[English]"] || "";
  if(enRaw){
    if(hasHebrew(enRaw)) h += `<div class="note">${t("en_layer_note")}</div>`;
    else h += `<div class="sect"><div class="h">${t("sec_en")}</div>${esc(enRaw)}</div>`;
  }
  const mhRaw = s["[Hebrew Modern]"] || "";
  if(mhRaw){
    if(!hasHebrew(mhRaw)) h += `<div class="note">${t("mh_layer_note")}</div>`;
    else h += `<div class="sect"><div class="h">${t("sec_mh")}</div><div class="he small">${esc(mhRaw)}</div></div>`;
  }
  /* источники — всегда из реестра: цитата модели может называть неверный стих.
     Показываем весь span эпизода (начало–конец): слова реплики могут лежать
     не в первом стихе эпизода, а в соседнем внутри него. */
  let srcList = v.sources.map(x => bookName(x[0]) + " " + x[1].span.start +
    (x[1].span.end && x[1].span.end !== x[1].span.start ? "–" + x[1].span.end : ""));
  if(!srcList.length) srcList = hits.slice(0,3).map(x => bookName(x[1]) + " " + x[2].span.start);
  const refs = v.sources.map(x => x[1].span.start).filter(Boolean);
  const claimed = (String(s["[SOURCES]"] || "").match(/\d+[:.]\d+/g) || []).map(x => x.replace(".", ":"));
  if(refs.length && claimed.length && !claimed.some(c => refs.includes(c)))
    h += `<div class="note">${t("src_fixed")}</div>`;
  h += `<div class="src">${t("sources")}${linkSources(srcList.join(", "))}</div>`;
  /* «образ Бога» пользователю: по каким числам реестра выбран эпизод —
     форма реакции класса и вероятности исходов (не догадка модели, а реестр). */
  if(r.cls){
    const prof = await godProfile();
    const rm = prof && prof.response_modes && prof.response_modes[r.cls];
    const bt = prof && prof.by_trigger && prof.by_trigger[r.cls];
    if(rm && bt){
      const dist = Object.entries(rm.distribution).sort((a,b)=>b[1]-a[1]).slice(0,2)
        .map(([k,v])=> dn("mode",k)+" "+(v*100).toFixed(0)+"%").join(" · ");
      const outs = Object.entries(bt.outcome_p).sort((a,b)=>b[1]-a[1]).slice(0,3)
        .map(([k,v])=> dn("out",k)+" "+(v*100).toFixed(0)+"%").join(" · ");
      h += `<div class="src">${t("beh_line")} ${esc(dn("trig", r.cls))}: ${esc(dist)} · ${t("beh_out")} ${esc(outs)}</div>`;
    }
  }
  h += `${memLine()}</div>`;
  return h;
}
async function corpusHTML(r, noteKey){

  return h;
}

function clipList(am, ch, v1, v2){
  /* → [[url, begin, end], ...]: выбранная скорость + fluent как запасной (дедуп по url) */
  if(!am) return [];

const PLAYER = { a: null, hi: null, stop: null, ui: null, dur: 0 };
const fmtT = d => { if(!isFinite(d) || d < 0) return "–:––"; const t = d|0; return (t/60|0) + ":" + String(t%60).padStart(2,"0"); };
/* перевод у стиха: если показаны все — схлопнуть и оставить только этот; иначе toggle этого */

/* clips = [[url, begin, end], ...] — пробуем по порядку: основной источник молчит
   (медленный CDN/блокировка) — автоматически берём запасной (другую скорость) */
function playClip(clips, hiEl){
  if(!clips || !clips.length) return;
  if(!PLAYER.a){
    PLAYER.a = new Audio();
    PLAYER.a.onplay = () => { const b = document.getElementById("pPlay"); if(b) b.textContent = "⏸"; };
    PLAYER.a.onpause = () => { const b = document.getElementById("pPlay"); if(b) b.textContent = "▶"; };
    PLAYER.a.onended = () => { const b = document.getElementById("pPlay"); if(b) b.textContent = "▶"; };
    PLAYER.a.addEventListener("timeupdate", () => {
      const ui = PLAYER.ui, a2 = PLAYER.a;
      if(!ui || !a2 || !a2.src || a2.src !== ui.clips[0][0]) return;
      if(PLAYER.dur && ui.fill) ui.fill.style.width = Math.min(100, a2.currentTime / PLAYER.dur * 100).toFixed(1) + "%";
      if(ui.time) ui.time.textContent = fmtT(a2.currentTime) + " / " + fmtT(PLAYER.dur);
      if(ui.vmap && ui.verses){
        const t = a2.currentTime;
        let cur = null;
        for(const [v, cl] of Object.entries(ui.vmap)){
          if(v === "a") continue;
          if(t >= cl[0] && t < cl[1]) { cur = +v; break; }
        }
        if(cur !== ui.lastV){
          ui.verses.forEach((el, i) => el.classList.toggle("playing", i + 1 === cur));
          if(cur && ui.verses[cur - 1]) ui.verses[cur - 1].scrollIntoView({ behavior: "smooth", block: "center" });
          ui.lastV = cur;
        }
      }
    });
  }
  const a = PLAYER.a;
  if(PLAYER.hi){ PLAYER.hi.classList.remove("playing"); PLAYER.hi = null; }
  if(PLAYER.stop){ a.removeEventListener("timeupdate", PLAYER.stop); PLAYER.stop = null; }
  a.onerror = null;
  const tryN = (i) => {
    const [u, b, e] = clips[i];
    const seek = () => { a.currentTime = b; a.play(); };
    a.onerror = () => { if(i + 1 < clips.length) tryN(i + 1); };
    if(a.src !== u){ a.src = u; a.addEventListener("loadedmetadata", () => { PLAYER.dur = isFinite(a.duration) ? a.duration : 0; seek(); }, {once:true}); }
    else seek();
    if(hiEl){ hiEl.classList.add("playing"); PLAYER.hi = hiEl; }
    PLAYER.stop = () => {
      if(a.currentTime >= e){
        a.pause();
        if(PLAYER.hi){ PLAYER.hi.classList.remove("playing"); PLAYER.hi = null; }
        a.removeEventListener("timeupdate", PLAYER.stop);

function md2html(md, toc){
  const lines = md.split("\n"); const out = []; let inList = false;
  let h2n = 0;
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/\*([^*]+)\*/g,"<i>$1</i>")
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  let i = 0;
  while(i < lines.length){
    const L = lines[i];
    if(/^\|/.test(L) && i+1<lines.length && /^\|[\s:|-]+\|/.test(lines[i+1])){
      const rows = [L]; let j = i+2;
      while(j<lines.length && /^\|/.test(lines[j])){ rows.push(lines[j]); j++; }
      const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      out.push("<table><tr>"+cells(rows[0]).map(c=>"<th>"+c+"</th>").join("")+"</tr>");
      for(let k=1;k<rows.length;k++) out.push("<tr>"+cells(rows[k]).map(c=>"<td>"+c+"</td>").join("")+"</tr>");
      out.push("</table>"); i = j; continue;
    }
    if(/^###\s/.test(L)) out.push("<h3>"+inline(L.slice(4))+"</h3>");
    else if(/^##\s/.test(L)){
      const id = "s"+(h2n++);
      out.push(`<h2 id="${id}">`+inline(L.slice(3))+"</h2>");
      if(toc) toc.push([id, L.slice(3).replace(/\*\*/g,"").trim()]);
    }
    else if(/^#\s/.test(L)) out.push(`<h2 id="s${h2n++}" style='font-size:21px'>`+inline(L.slice(2))+"</h2>");
    else if(/^---+\s*$/.test(L)) out.push("<hr>");
    else if(/^[-*]\s/.test(L)){
      if(!inList){ out.push("<ul>"); inList = true; }
      out.push("<li>"+inline(L.replace(/^[-*]\s/,""))+"</li>");
      if(i+1>=lines.length || !/^[-*]\s/.test(lines[i+1])){ out.push("</ul>"); inList = false; }
    }
    else if(/^\d+\.\s/.test(L)) out.push("<li>"+inline(L.replace(/^\d+\.\s/,""))+"</li>");
    else if(/^>\s?/.test(L)) out.push("<blockquote>"+inline(L.replace(/^>\s?/,""))+"</blockquote>");
    else if(L.trim()!=="") out.push("<p>"+inline(L)+"</p>");
    i++;
  }
  if(inList) out.push("</ul>");
  return out.join("\n");
}

        if(s["[HEBREW]"]) parts.push(`<div class="sect"><div class="h">${t("sec_hebrew")} ${badge}</div><div class="he">${esc(stripNikudJs(s["[HEBREW]"]))}</div></div>`);
        if(mode === "reject") parts.push(`<div class="note">${t("he_layer_note")}</div>`);
        if(s["[NIKKUD]"]) parts.push(`<div class="sect"><div class="h">${t("sec_nikkud")}</div><div class="he small">${esc(s["[NIKKUD]"])}</div></div>`);
        if(s["[Russian]"]) parts.push(`<div class="sect"><div class="h">${t("sec_ru_live")}</div>${esc(s["[Russian]"])}</div>`);
        if(s["[English]"]) parts.push(`<div class="sect"><div class="h">${t("sec_en")}</div>${esc(s["[English]"])}</div>`);
        if(s["[Hebrew Modern]"]) parts.push(`<div class="sect"><div class="h">${t("sec_mh")}</div><div class="he small">${esc(s["[Hebrew Modern]"])}</div></div>`);
        const src = (x.sources || []).map(y => bookName(y.book) + " " + y.start +
          (y.end && y.end !== y.start ? "–" + y.end : "")).join(", ") || s["[SOURCES]"] || "";
        return `<div class="detail"><div class="msg-user"><div class="s">${esc(t("dlg_q"))}</div>${esc(x.q||"")}</div>` +
          `<h3>${t("god_h")}</h3>` + parts.join("") +
          (src ? `<div class="src">${t("sources")}${linkSources(src)}</div>` : "") + `</div>`;
      }).join("")
    : `<div class="note">${t("dlg_empty")}</div>`;
  const date = dlg ? fmtDay(dlg.generated) : "";
  m.innerHTML = `<h2>${t("dlg_h")}</h2>` + head.join("") +
    `<div class="note">${esc(tfmt("dlg_note", {date}))}</div>` + body +
    `<div class="note"><span class="cl" onclick='goTab("chat")'>${esc(t("dlg_ask"))}</span></div>`;
}
async function tAbout(m){
  const a = await analytics();
  m.innerHTML = `<h2>${t("about_h")}</h2>
  <div class="disclaim">${t("sim_note")}</div>
  <div class="card">
  <p>${tfmt("about_p1", {eps:a.corpus.episodes})}</p>
  <p>${t("about_p2")}</p>
  <p>${t("about_p3")}</p>
  <p>${t("about_p4")}</p>
  <p>${t("about_p5")}</p>
  <p class="note">${t("about_data")}</p></div>`;
}

/* ---------- роутер ---------- */
const TABS = [ ["chat","tab_chat"], ["dialogs","tab_dialogs"], ["overview","tab_overview"], ["books","tab_books"], ["read","tab_read"], ["episodes","tab_episodes"],
               ["profile","tab_profile"], ["report","tab_report"], ["about","tab_about"] ];
const RENDER = { overview:tOverview, books:tBooks, read:tRead, episodes:tEpisodes, profile:tProfile,
                 chat:chatUI, dialogs:tDialogs, report:tReport, about:tAbout };
function renderNav(){
  nav.innerHTML = TABS.map(x => `<button data-t="${x[0]}"${x[0]===CURTAB?' class="on"':""}>${t(x[1])}</button>`).join("");
  nav.querySelectorAll("button").forEach(b => b.onclick = () => {
    CURTAB = b.dataset.t;
    renderAll();
  });
}
renderAll();
</script>
